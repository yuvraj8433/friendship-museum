<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Friendship Museum</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Shantell+Sans:wght@400;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--a:#F5A524;--b:#FF6B57;--c:#14A38B;--d:#5B62E8;--e:#E14B8A;--ink:#17332d;--bg1:#e6f6f0;--bg2:#fff3dc;--card:#fff;--acc:#F5A524;--acc2:#FF6B57;--mut:#6b8079}
[data-vibe=calm]{--bg1:#e4eefb;--bg2:#e6f6f0;--acc:#5B62E8;--acc2:#14A38B}
[data-vibe=roast]{--bg1:#ffe6e0;--bg2:#fff0d6;--acc:#FF6B57;--acc2:#E14B8A}
[data-vibe=ride]{--bg1:#e9e4fb;--bg2:#dff4ee;--acc:#14A38B;--acc2:#5B62E8}
*{box-sizing:border-box;margin:0}
body{font-family:Outfit,system-ui,sans-serif;color:var(--ink);min-height:100vh;background:linear-gradient(135deg,var(--bg1),var(--bg2));overflow-x:hidden}
#bg{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.thread{position:absolute;bottom:-12vh;border-radius:4px;opacity:.55;animation:rise linear infinite}
@keyframes rise{to{transform:translateY(-125vh) rotate(40deg)}}
.shell{position:relative;z-index:1;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.card{background:var(--card);border-radius:24px;box-shadow:0 20px 60px #17332d22;width:100%;max-width:460px;padding:26px 22px;animation:pop .35s ease}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.98)}}
.brand{display:flex;align-items:center;gap:8px;justify-content:center;margin-bottom:10px}
.knot{width:22px;height:22px;border-radius:50%;background:conic-gradient(var(--b),var(--a),var(--c),var(--d),var(--e),var(--b));-webkit-mask:radial-gradient(circle 5px,transparent 98%,#000 100%);mask:radial-gradient(circle 5px,transparent 98%,#000 100%)}
.bn{font-weight:800;font-family:'Bricolage Grotesque'}.bn b{color:var(--acc2)}
.tag{background:#fff0cc;color:#b36b00;font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px;text-transform:uppercase;letter-spacing:.05em}
.dots{display:flex;gap:5px;margin:8px 0 16px}.dot{flex:1;height:4px;border-radius:9px;background:#e3ece8}.dot.on{background:var(--acc)}
.chip{display:inline-block;background:#fff0cc;border-radius:99px;padding:5px 12px;font-size:12px;font-weight:600;margin-bottom:10px}
.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--c);font-weight:700;text-align:center;margin-bottom:6px}
h1{font-family:'Bricolage Grotesque';font-size:28px;line-height:1.1;text-align:center;font-weight:800}
h1 em{font-style:normal;color:var(--acc);text-decoration:underline wavy var(--acc);text-underline-offset:5px}
.sub{text-align:center;color:var(--mut);margin:10px 0 16px;font-size:14px}
label{display:block;font-weight:600;font-size:13px;margin:12px 0 5px}label small{font-weight:400;color:var(--mut)}
input[type=text],select,textarea{width:100%;font:inherit;padding:12px 14px;border:1.5px solid #dbe7e2;border-radius:12px;background:#f8fbfa;color:var(--ink)}
textarea{min-height:130px;resize:vertical}input:focus,textarea:focus,select:focus{outline:2px solid var(--acc);border-color:transparent}
.duo{display:flex;gap:8px}
.btn{width:100%;font:inherit;font-weight:700;border:0;border-radius:14px;padding:14px;color:#fff;background:linear-gradient(90deg,var(--acc),var(--acc2));cursor:pointer;margin-top:16px;transition:.15s}
.btn:hover{transform:translateY(-1px)}.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.btn.ghost{background:#eef5f2;color:var(--ink)}.row{display:flex;gap:8px}.row .btn{margin-top:16px}.row .btn.ghost{width:56px;flex:none}
.hint{text-align:center;font-size:12px;color:var(--mut);margin-top:10px}
.tiles{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:6px}
.tile,.opt,.pill{font:inherit;border:1.5px solid #dbe7e2;background:#fff;border-radius:14px;cursor:pointer;color:var(--ink);transition:.15s}
.tile{padding:14px 4px;display:flex;flex-direction:column;align-items:center;gap:4px;font-weight:600;font-size:13px}.tile span:first-child{font-size:24px}
.tile.on,.opt.on,.pill.on{border-color:var(--acc);background:#fff7e6;box-shadow:0 0 0 2px var(--acc) inset}
.opt{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:12px;margin-bottom:8px}.opt .em{font-size:26px}.opt b{display:block}.opt small{color:var(--mut)}
.pill{padding:9px 13px;margin:0 6px 8px 0;font-size:13.5px}
.photos{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.ph{border-radius:14px;border:1.5px solid #dbe7e2;padding:6px;font-size:12px}.ph img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px}.ph input{margin-top:5px;padding:7px 9px;font-size:12px}
.ph button{font:inherit;font-size:12px;margin-top:5px;width:100%;border:0;border-radius:8px;padding:5px;background:#eef5f2;cursor:pointer}.ph button.on{background:var(--acc);color:#fff}
.drop{display:block;border:2px dashed #c4d8d1;border-radius:16px;text-align:center;padding:22px 10px;cursor:pointer;color:var(--mut);font-size:14px}
.stamps{display:flex;gap:8px;flex-wrap:wrap}.stamps .pill{font-size:22px;padding:6px 12px;margin:0}
.count{text-align:right;font-size:12px;color:var(--mut)}
.badge{position:fixed;top:10px;left:50%;transform:translateX(-50%);z-index:5;background:var(--ink);color:#fff;font-size:11px;font-weight:700;padding:4px 12px;border-radius:99px;letter-spacing:.1em;display:none}
.fix{position:fixed;top:10px;z-index:6;font:inherit;font-weight:600;font-size:13px;border:0;background:#ffffffcc;backdrop-filter:blur(6px);border-radius:99px;padding:8px 14px;cursor:pointer;box-shadow:0 2px 8px #0002}
#back{left:10px;display:none}#mute{right:10px}
.hidden{display:none!important}

/* museum */
.museum{width:100%;max-width:480px;position:relative}
.pill-room{text-align:center;margin-bottom:10px;font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink)}
.pill-room i{display:flex;gap:4px;margin-top:6px;justify-content:center}.pill-room i s{width:20px;height:4px;border-radius:9px;background:#00000018}.pill-room i s.on{background:var(--acc2)}
.room{background:#fff;border-radius:24px;box-shadow:0 20px 60px #17332d22;padding:28px 22px;text-align:center;animation:pop .4s ease;min-height:420px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:14px}
.room h2{font-family:'Bricolage Grotesque';font-size:27px;line-height:1.15}.room p{color:var(--mut);font-size:15px}
.door{width:150px;height:220px;border-radius:80px 80px 6px 6px;background:linear-gradient(var(--acc),var(--acc2));position:relative;cursor:pointer;box-shadow:inset 0 0 0 8px #ffffff55;transition:.1s;user-select:none}
.door::after{content:"";position:absolute;right:20px;top:110px;width:14px;height:14px;border-radius:50%;background:#fff}
.door.k{animation:knock .25s}@keyframes knock{30%{transform:rotate(-2deg) scale(.98)}60%{transform:rotate(2deg)}}
.door.open{transform:perspective(500px) rotateY(-70deg);transform-origin:left;opacity:.4;transition:.8s}
.odo{display:flex;gap:4px;justify-content:center}.odo span{background:var(--ink);color:#fff;font-family:'Bricolage Grotesque';font-weight:800;font-size:34px;padding:6px 10px;border-radius:10px}
.note{background:#fff7e6;border:2px dashed var(--acc);border-radius:16px;padding:16px;font-family:'Shantell Sans';font-size:17px;width:100%;animation:pop .35s;transform:rotate(-1deg)}.note:nth-child(even){transform:rotate(1.2deg)}
.notes{display:flex;flex-direction:column;gap:10px;width:100%}
.frame{width:100%;max-width:300px;aspect-ratio:1;border:10px solid #8a5a2b;border-radius:6px;background:#fffdf7;box-shadow:0 8px 20px #0003;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:70px}
.frame img{width:100%;height:100%;object-fit:cover}
.cap{font-family:'Shantell Sans';font-size:17px;color:var(--ink);min-height:26px}
.nav{display:flex;gap:10px;align-items:center}.nav button{font:inherit;border:0;background:#eef5f2;width:42px;height:42px;border-radius:50%;cursor:pointer;font-size:18px}
.pz{display:grid;gap:3px;width:100%;max-width:300px;aspect-ratio:1;background:var(--ink);padding:3px;border-radius:10px}
.pz div{background-size:var(--sz);cursor:pointer;border-radius:3px;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:800;color:#fff}.pz div.sel{outline:4px solid var(--a);z-index:2}
.env{width:260px;height:170px;background:#f7d9a6;border-radius:8px;position:relative;cursor:pointer;box-shadow:0 10px 24px #0003}
.env::before{content:"";position:absolute;inset:0;background:linear-gradient(to bottom right,transparent 49.5%,#e4b878 50%) top/100% 55% no-repeat,linear-gradient(to bottom left,transparent 49.5%,#e4b878 50%) top/100% 55% no-repeat;border-radius:8px}
.seal{position:absolute;left:50%;top:48%;transform:translate(-50%,-50%);width:58px;height:58px;border-radius:50%;background:var(--b);display:flex;align-items:center;justify-content:center;font-size:28px;box-shadow:0 3px 8px #0005;transition:.4s}
.env.broken .seal{transform:translate(-50%,-50%) scale(0);opacity:0}
.letter{background:#fffdf5;border-radius:14px;padding:18px;font-family:'Shantell Sans';font-size:16.5px;line-height:1.55;text-align:left;white-space:pre-wrap;width:100%;border:1px solid #f0e3c4;box-shadow:0 4px 14px #0001}
.rule{display:flex;gap:10px;align-items:center;text-align:left;padding:12px;border:1.5px solid #dbe7e2;border-radius:12px;width:100%;cursor:pointer;font-weight:500;background:#fff;font:inherit}
.rule .bx{width:24px;height:24px;border-radius:7px;border:2px solid #b8cbc4;flex:none;display:flex;align-items:center;justify-content:center;color:#fff;font-size:15px}.rule.on{background:#effaf6;border-color:var(--c)}.rule.on .bx{background:var(--c);border-color:var(--c)}
canvas.sig{width:100%;height:150px;background:#fff;border:2px dashed #b8cbc4;border-radius:12px;touch-action:none}
.cert{border:3px double var(--acc);border-radius:16px;padding:18px;width:100%;background:#fffdf7}
.cert big{font-family:'Bricolage Grotesque';font-size:22px;font-weight:800;display:block;margin:6px 0}
.stats{display:flex;gap:8px;justify-content:center;margin-top:10px}.stats div{background:#f2f8f6;padding:8px 12px;border-radius:10px;font-size:12px}.stats b{display:block;font-size:18px}
.confetti{position:fixed;top:-20px;font-size:22px;animation:fall linear forwards;z-index:9;pointer-events:none}@keyframes fall{to{transform:translateY(110vh) rotate(500deg)}}
.share{width:100%;font:inherit;font-size:12px;padding:10px;border:1.5px solid #dbe7e2;border-radius:10px}

/* ---- v2 design ---- */
body{background:radial-gradient(circle at 15% 10%,#fff6 0,transparent 40%),radial-gradient(circle at 85% 90%,var(--bg2) 0,transparent 50%),linear-gradient(135deg,var(--bg1),var(--bg2));background-attachment:fixed}
.fl{position:absolute;bottom:-10vh;font-size:26px;opacity:.7;animation:rise linear infinite;filter:drop-shadow(0 3px 4px #0002)}
.card,.room{border:2px solid #fff;background:linear-gradient(#fff,#fffdf8);position:relative;overflow:hidden}
.card::before,.room::before{content:"";position:absolute;left:0;right:0;top:0;height:6px;background:linear-gradient(90deg,var(--a),var(--b),var(--e),var(--d),var(--c))}
.card::after{content:"✨";position:absolute;right:14px;top:16px;font-size:20px;animation:tw 2s infinite}
@keyframes tw{50%{transform:scale(1.3) rotate(15deg);opacity:.6}}
h1,.room h2{background:linear-gradient(90deg,var(--ink),var(--ink) 60%,var(--acc2));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
h1 em{-webkit-text-fill-color:var(--acc)}
.btn{box-shadow:0 6px 0 #0002,0 10px 18px #0001;position:relative;overflow:hidden}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #0002}
.btn::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(90deg,transparent,#fff7,transparent);transform:skewX(-20deg);animation:shine 3s infinite}
@keyframes shine{to{left:130%}}
.btn.ghost::after{display:none}
.tile:hover,.opt:hover,.pill:hover{transform:translateY(-2px) rotate(-1deg)}
.tile span:first-child{font-size:30px;animation:bob 3s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
.rico{font-size:54px;animation:bob 2.5s ease-in-out infinite;filter:drop-shadow(0 6px 6px #0002)}
.note::before{content:"📌";position:absolute;margin:-26px 0 0 -8px}.note{position:relative;margin-top:12px}
.frame{position:relative}.frame::after{content:"🌟";position:absolute;right:-6px;top:-8px;font-size:22px}
.cert{background:repeating-linear-gradient(45deg,#fffdf7,#fffdf7 12px,#fff8e6 12px,#fff8e6 24px)}
.reply textarea{min-height:70px;margin-top:8px}
.dash{width:100%;max-width:640px;background:#fff;border-radius:22px;padding:22px;box-shadow:0 20px 60px #17332d22}
.dash table{width:100%;border-collapse:collapse;font-size:13px;margin:8px 0 14px}.dash td,.dash th{border-bottom:1px solid #e3ece8;padding:7px 5px;text-align:left;vertical-align:top}
.dash .tools{display:flex;gap:8px;flex-wrap:wrap}.dash .tools .btn{margin:0;width:auto;padding:10px 14px;font-size:13px}
.dlink{display:block;text-align:center;margin-top:12px;font-size:13px;font-weight:600;color:var(--c);cursor:pointer;background:none;border:0;font-family:inherit;width:100%}
</style>
</head>
<body>
<div id="bg"></div>
<button class="fix" id="back">← Back</button>
<button class="fix" id="mute" aria-label="Toggle sound">🔊</button>
<div class="badge" id="badge">PREVIEW</div>
<div class="shell" id="shell"></div>

<script>
(()=>{
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shell=$('#shell');
const KINDS=[['bestie','💛','Bestie'],['child','🧒','Childhood'],['college','🎓','College crew'],['work','💼','Work bestie'],['sib','🏠','Sibling-coded'],['online','🌐','Online friend']];
const VIBES=[['chaos','🤪','Chaotic & loud','Screaming, memes, zero volume control'],['calm','🌱','Calm & deep','3am talks and comfortable silences'],['roast','😈','Roast first, love later','Insults are our love language'],['ride','🛡️','Ride or die','One call and I am already there']];
const NOTES=['You never let me spiral alone','You laugh at my worst jokes','You show up. Every single time.','You know all my stories','You tell me when I am being an idiot','You have seen me at my worst','You are my emergency contact','You make boring days fun'];
const RULES=['Reply to my texts within one business week','Never let me leave the house in that shirt','Show up when it matters, without being asked','Keep every secret, forever, no exceptions','Split the last slice, always','Answer the phone at 3am at least once a year','Roast me in private, defend me in public'];
const SEALS=['💛','🤝','⭐','🔥','♾️'],STICKERS=['🤗','🥳','🥹','😎','😻'];
const MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
const KIND_LINE={bestie:'best friend',child:'oldest friend',college:'college partner-in-crime',work:'work bestie',sib:'sibling in all but blood',online:'favourite person on the internet'};

let S={step:1,name:'',from:'',kind:'bestie',sm:'',sy:'',vibe:'chaos',notes:[],photos:[],pz:0,grid:3,msg:'',seal:'💛',sticker:'🤗',rules:[]};
let V=null; // view state
let muted=false,actx=null;

/* ---------- background threads ---------- */
const cols=['#F5A524','#FF6B57','#14A38B','#5B62E8','#E14B8A','#93C93C'];
$('#bg').innerHTML=Array.from({length:10},(_,i)=>`<span class="thread" style="width:${10+Math.random()*20}px;height:${3+Math.random()*2}px;left:${Math.random()*100}%;background:${cols[i%6]};animation-duration:${24+Math.random()*10}s;animation-delay:-${Math.random()*25}s"></span>`).join('');

$('#bg').insertAdjacentHTML('beforeend',['💛','🎈','🧸','🍕','🎶','📸','🌈','🤝','🍦','⭐','🎁','🦋'].map((e,i)=>`<span class="fl" style="left:${4+i*8}%;animation-duration:${20+(i*3)%14}s;animation-delay:-${(i*5)%22}s">${e}</span>`).join(''));

/* ---------- storage ----------
   Gifts and replies are always kept in this browser (localStorage).
   DB = your Firebase Realtime Database URL, e.g. 'https://my-museum-default-rtdb.firebaseio.com'  (no trailing slash).
   With DB set you get short links and replies from friends' phones. Leave '' to use long links only. */
const CONFIG={DB:'https://friend-museum-default-rtdb.firebaseio.com/',KEY_GIFTS:'om_gifts',KEY_REPLIES:'om_replies'};
const dbGet=k=>{try{return JSON.parse(localStorage.getItem(k)||'[]')}catch(e){return[]}};
const dbAdd=(k,o)=>{try{const a=dbGet(k);a.push(o);localStorage.setItem(k,JSON.stringify(a))}catch(e){}};
// Firebase Realtime Database REST call. Resolves with the JSON, rejects if the request fails.
async function fb(method,path,body){
  if(!CONFIG.DB)throw new Error('DB is not set');
  const r=await fetch(CONFIG.DB.replace(/\/+$/,'')+'/'+path+'.json',{method,body:body===undefined?undefined:JSON.stringify(body)});
  if(!r.ok)throw new Error('Database said '+r.status+(r.status==401?' (check the Rules tab)':''));
  return r.json();
}
async function loadGift(code){try{const g=await fb('GET','gifts/'+encodeURIComponent(code));return g&&g.name?g:null}catch(e){return null}}
const uid=()=>Math.random().toString(36).slice(2,9);

/* ---------- sound ---------- */
function beep(f=520,d=.12,t='sine',v=.08){if(muted)return;try{actx=actx||new(window.AudioContext||window.webkitAudioContext)();const o=actx.createOscillator(),g=actx.createGain();o.type=t;o.frequency.value=f;g.gain.value=v;g.gain.exponentialRampToValueAtTime(.0001,actx.currentTime+d);o.connect(g).connect(actx.destination);o.start();o.stop(actx.currentTime+d)}catch(e){}}
const chime=()=>[523,659,784,1047].forEach((f,i)=>setTimeout(()=>beep(f,.25),i*110));
$('#mute').onclick=()=>{muted=!muted;$('#mute').textContent=muted?'🔇':'🔊'};
function confetti(n=40){const em=['🎉','💛','✨','🧡','💫','🎊'];for(let i=0;i<n;i++){const e=document.createElement('span');e.className='confetti';e.textContent=em[i%em.length];e.style.left=Math.random()*100+'vw';e.style.animationDuration=2+Math.random()*2.5+'s';document.body.appendChild(e);setTimeout(()=>e.remove(),5000)}}

/* ---------- WIZARD ---------- */
function wiz(){
  document.body.dataset.vibe=S.vibe;
  $('#back').style.display='none';$('#badge').style.display='none';
  const n=S.step;
  const dots=Array.from({length:7},(_,i)=>`<span class="dot ${i<n?'on':''}"></span>`).join('');
  const nav=(next,label='Next →',ok=true)=>`<div class="row"><button class="btn ghost" data-act="prev">←</button><button class="btn" data-act="${next}" ${ok?'':'disabled'}>${label}</button></div>`;
  let h='';
  if(n==1)h=`<span class="chip">🚪 No occasion needed · send it any day</span><p class="eyebrow">Not a card · a 9-room adventure</p><h1>Build your best friend a <em>museum</em>.</h1><p class="sub">You’re about to make someone’s day unforgettable 🎀</p>
  <label>Who is this for?</label><input type="text" id="f-name" maxlength="40" placeholder="Your friend’s name" value="${esc(S.name)}">
  <label>And what’s your name?</label><input type="text" id="f-from" maxlength="40" placeholder="Your name" value="${esc(S.from)}">
  <button class="btn" id="go1" data-act="next" ${S.name&&S.from?'':'disabled'}>Start building →</button><p class="hint">Takes about 4 minutes · works on any phone</p><button class="dlink" data-act="dash">📂 My gifts & replies</button>`;
  if(n==2){const yrs=Array.from({length:50},(_,i)=>2026-i);h=`<p class="eyebrow">Step 2 · About them</p><h1>What kind of <em>friend</em> are they?</h1><p class="sub">Pick the one that fits <b>${esc(S.name)}</b> best.</p>
  <div class="tiles">${KINDS.map(k=>`<button class="tile ${S.kind==k[0]?'on':''}" data-kind="${k[0]}"><span>${k[1]}</span><span>${k[2]}</span></button>`).join('')}</div>
  <label>When did you two become friends? <small>— optional. We’ll count the days for them.</small></label>
  <div class="duo"><select id="f-sm"><option value="">Month</option>${MONTHS.map((m,i)=>`<option value="${i+1}" ${S.sm==i+1?'selected':''}>${m}</option>`).join('')}</select><select id="f-sy"><option value="">Year</option>${yrs.map(y=>`<option ${S.sy==y?'selected':''}>${y}</option>`).join('')}</select></div>${nav('next')}`}
  if(n==3)h=`<p class="eyebrow">Step 3 · Your vibe & little notes</p><h1>How are you two <em>together</em>?</h1><p class="sub">This sets the colours and the mood of the whole gift.</p>
  ${VIBES.map(v=>`<button class="opt ${S.vibe==v[0]?'on':''}" data-vibe="${v[0]}"><span class="em">${v[1]}</span><span><b>${v[2]}</b><small>${v[3]}</small></span></button>`).join('')}
  <label>Now, why they matter to you — tap up to 5. <small>They open each note one by one.</small></label>

function tog(a,v,max){const i=a.indexOf(v);if(i>=0)a.splice(i,1);else if(a.length<max)a.push(v)}

async function makeLink(){

    let dr=false,ink=0;const pt=e=>{const b=c.getBoundingClientRect();return[e.clientX-b.left,e.clientY-b.top]};

function puzzle(p,n){
  frame(`<h2>Puzzle Workshop</h2><p>Tap two pieces to swap them. Put the photo back together.</p><div class="pz" id="pz" style="grid-template-columns:repeat(${n},1fr)"></div><p id="mv">Moves: 0</p>`);
  const N=n*n;let order=[...Array(N).keys()];
  do{for(let k=N-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[order[k],order[j]]=[order[j],order[k]]}}while(order.every((v,k)=>v==k)||false);
  let sel=null;const el=$('#pz');
  const draw=()=>{el.innerHTML=order.map((v,k)=>`<div data-k="${k}" class="${sel===k?'sel':''}" style="--sz:${n*100}% ${n*100}%;background-image:url(${p.src});background-size:${n*100}% ${n*100}%;background-position:${(v%n)*100/(n-1)}% ${Math.floor(v/n)*100/(n-1)}%"></div>`).join('')};
  draw();
  el.onclick=e=>{const d=e.target.closest('[data-k]');if(!d)return;const k=+d.dataset.k;
    if(sel===null){sel=k;draw();return}
    if(sel!==k){[order[sel],order[k]]=[order[k],order[sel]];V.moves++;$('#mv').textContent='Moves: '+V.moves;beep(440,.07)}
    sel=null;draw();
    if(order.every((v,j)=>v==j)){chime();confetti(25);setTimeout(()=>{$('#room').insertAdjacentHTML('beforeend',next());$('#nx').onclick=go},300)}};
}

  shell.innerHTML='<div class="card"><h1>Opening your gift… 🎁</h1><p class="sub">Just a moment</p></div>';
  (async()=>{let g=null;for(let t=0;t<4&&!g;t++){g=await loadGift(mc[1]);if(!g)await new Promise(r=>setTimeout(r,1500))}
    if(g)startMuseum(g,false);else shell.innerHTML='<div class="card"><h1>Gift not found 😢</h1><p class="sub">Ask your friend to send the link again.</p></div>'})();
}else wiz();
})();
</script>
