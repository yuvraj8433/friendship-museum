<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Friendship Museum</title>
<meta property="og:title" content="A little surprise, made just for you 🎁"><meta property="og:description" content="Open it to see what someone special made for you."><meta property="og:type" content="website"><meta name="twitter:card" content="summary">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Shantell+Sans:wght@400;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<style>
:root{--a:#F5A524;--b:#FF6B57;--c:#14A38B;--d:#5B62E8;--e:#E14B8A;--ink:#17332d;--bg1:#e6f6f0;--bg2:#fff3dc;--card:#fff;--acc:#F5A524;--acc2:#FF6B57;--mut:#6b8079}
[data-vibe=calm]{--bg1:#e4eefb;--bg2:#e6f6f0;--acc:#5B62E8;--acc2:#14A38B}
[data-vibe=roast]{--bg1:#ffe6e0;--bg2:#fff0d6;--acc:#FF6B57;--acc2:#E14B8A}
[data-vibe=ride]{--bg1:#e9e4fb;--bg2:#dff4ee;--acc:#14A38B;--acc2:#5B62E8}
*{box-sizing:border-box;margin:0}
body{font-family:Outfit,system-ui,sans-serif;color:var(--ink);min-height:100vh;background:linear-gradient(135deg,var(--bg1),var(--bg2));overflow-x:hidden}
#bg{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.thread{position:absolute;bottom:-12vh;border-radius:4px;opacity:.55;animation:rise linear infinite}
@keyframes rise{to{transform:translateY(-125vh) rotate(40deg)}}
.shell{position:relative;z-index:1;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:54px 16px 16px}
.card{background:var(--card);border-radius:24px;box-shadow:0 20px 60px #17332d22;width:100%;max-width:460px;padding:26px 22px;animation:pop .35s ease}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.98)}}
.brand{display:flex;align-items:center;gap:8px;justify-content:center;margin-bottom:10px}
.knot{width:22px;height:22px;border-radius:50%;background:conic-gradient(var(--b),var(--a),var(--c),var(--d),var(--e),var(--b));-webkit-mask:radial-gradient(circle 5px,transparent 98%,#000 100%);mask:radial-gradient(circle 5px,transparent 98%,#000 100%)}
.bn{font-weight:800;font-family:'Bricolage Grotesque'}.bn b{color:var(--acc2)}
.tag{background:#fff0cc;color:#b36b00;font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px;text-transform:uppercase;letter-spacing:.05em}
.dots{display:flex;gap:5px;margin:8px 0 16px}.dot{flex:1;height:4px;border-radius:9px;background:#e3ece8}.dot.on{background:var(--acc)}
.chip{display:inline-block;background:#fff0cc;border-radius:99px;padding:5px 12px;font-size:12px;font-weight:600;margin-bottom:10px}
.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--c);font-weight:700;text-align:center;margin-bottom:6px}
h1{font-family:'Bricolage Grotesque';font-size:28px;line-height:1.1;text-align:center;font-weight:800}
h1 em{font-style:normal;color:var(--acc);text-decoration:underline wavy var(--acc);text-underline-offset:5px}
.sub{text-align:center;color:var(--mut);margin:10px 0 16px;font-size:14px}
label{display:block;font-weight:600;font-size:13px;margin:12px 0 5px}label small{font-weight:400;color:var(--mut)}
input[type=text],input[type=email],input[type=password],select,textarea{width:100%;font:inherit;padding:12px 14px;border:1.5px solid #dbe7e2;border-radius:12px;background:#f8fbfa;color:var(--ink)}
textarea{min-height:130px;resize:vertical}input:focus,textarea:focus,select:focus{outline:2px solid var(--acc);border-color:transparent}
.duo{display:flex;gap:8px}
.btn{width:100%;font:inherit;font-weight:700;border:0;border-radius:14px;padding:14px;color:#fff;background:linear-gradient(90deg,var(--acc),var(--acc2));cursor:pointer;margin-top:16px;transition:.15s}
.btn:hover{transform:translateY(-1px)}.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.btn.ghost{background:#eef5f2;color:var(--ink)}.row{display:flex;gap:8px}.row .btn{margin-top:16px}.row .btn.ghost{width:56px;flex:none}
.hint{text-align:center;font-size:12px;color:var(--mut);margin-top:10px}
.tiles{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:6px}
.tile,.opt,.pill{font:inherit;border:1.5px solid #dbe7e2;background:#fff;border-radius:14px;cursor:pointer;color:var(--ink);transition:.15s}
.tile{padding:14px 4px;display:flex;flex-direction:column;align-items:center;gap:4px;font-weight:600;font-size:13px}.tile span:first-child{font-size:24px}
.tile.on,.opt.on,.pill.on{border-color:var(--acc);background:#fff7e6;box-shadow:0 0 0 2px var(--acc) inset}
.opt{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:12px;margin-bottom:8px}.opt .em{font-size:26px}.opt b{display:block}.opt small{color:var(--mut)}
.pill{padding:9px 13px;margin:0 6px 8px 0;font-size:13.5px}
.photos{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.ph{border-radius:14px;border:1.5px solid #dbe7e2;padding:6px;font-size:12px}.ph img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px}.ph input{margin-top:5px;padding:7px 9px;font-size:12px}
.ph button{font:inherit;font-size:12px;margin-top:5px;width:100%;border:0;border-radius:8px;padding:5px;background:#eef5f2;cursor:pointer}.ph button.on{background:var(--acc);color:#fff}
.drop{display:block;border:2px dashed #c4d8d1;border-radius:16px;text-align:center;padding:22px 10px;cursor:pointer;color:var(--mut);font-size:14px}
.stamps{display:flex;gap:8px;flex-wrap:wrap}.stamps .pill{font-size:22px;padding:6px 12px;margin:0}
.count{text-align:right;font-size:12px;color:var(--mut)}
.badge{position:fixed;top:10px;left:50%;transform:translateX(-50%);z-index:5;background:var(--ink);color:#fff;font-size:11px;font-weight:700;padding:4px 12px;border-radius:99px;letter-spacing:.1em;display:none}
.fix{position:fixed;top:10px;z-index:6;font:inherit;font-weight:600;font-size:13px;border:0;background:#ffffffcc;backdrop-filter:blur(6px);border-radius:99px;padding:8px 14px;cursor:pointer;box-shadow:0 2px 8px #0002}
#back{left:10px;display:none}#mute{right:10px}
.hidden{display:none!important}

/* museum */
.museum{width:100%;max-width:480px;position:relative}
.pill-room{text-align:center;margin-bottom:10px;font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink)}
.pill-room i{display:flex;gap:4px;margin-top:6px;justify-content:center}.pill-room i s{width:20px;height:4px;border-radius:9px;background:#00000018}.pill-room i s.on{background:var(--acc2)}
.room{background:#fff;border-radius:24px;box-shadow:0 20px 60px #17332d22;padding:28px 22px;text-align:center;animation:pop .4s ease;min-height:420px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:14px}
.room h2{font-family:'Bricolage Grotesque';font-size:27px;line-height:1.15}.room p{color:var(--mut);font-size:15px}
.door{width:150px;height:220px;border-radius:80px 80px 6px 6px;background:linear-gradient(var(--acc),var(--acc2));position:relative;cursor:pointer;box-shadow:inset 0 0 0 8px #ffffff55;transition:.1s;user-select:none}
.door::after{content:"";position:absolute;right:20px;top:110px;width:14px;height:14px;border-radius:50%;background:#fff}
.door.k{animation:knock .25s}@keyframes knock{30%{transform:rotate(-2deg) scale(.98)}60%{transform:rotate(2deg)}}
.door.open{transform:perspective(500px) rotateY(-70deg);transform-origin:left;opacity:.4;transition:.8s}
.odo{display:flex;gap:4px;justify-content:center}.odo span{background:var(--ink);color:#fff;font-family:'Bricolage Grotesque';font-weight:800;font-size:34px;padding:6px 10px;border-radius:10px}
.note{background:#fff7e6;border:2px dashed var(--acc);border-radius:16px;padding:16px;font-family:'Shantell Sans';font-size:17px;width:100%;animation:pop .35s;transform:rotate(-1deg)}.note:nth-child(even){transform:rotate(1.2deg)}
.notes{display:flex;flex-direction:column;gap:10px;width:100%}
.frame{width:100%;max-width:300px;aspect-ratio:1;border:10px solid #8a5a2b;border-radius:6px;background:#fffdf7;box-shadow:0 8px 20px #0003;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:70px}
.frame img{width:100%;height:100%;object-fit:cover}
.cap{font-family:'Shantell Sans';font-size:17px;color:var(--ink);min-height:26px}
.nav{display:flex;gap:10px;align-items:center}.nav button{font:inherit;border:0;background:#eef5f2;width:42px;height:42px;border-radius:50%;cursor:pointer;font-size:18px}
.pz{display:grid;gap:3px;width:100%;max-width:300px;aspect-ratio:1;background:var(--ink);padding:3px;border-radius:10px}
.pz div{background-size:var(--sz);cursor:pointer;border-radius:3px;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:800;color:#fff}.pz div.sel{outline:4px solid var(--a);z-index:2}
.env{width:260px;height:170px;background:#f7d9a6;border-radius:8px;position:relative;cursor:pointer;box-shadow:0 10px 24px #0003}
.env::before{content:"";position:absolute;inset:0;background:linear-gradient(to bottom right,transparent 49.5%,#e4b878 50%) top/100% 55% no-repeat,linear-gradient(to bottom left,transparent 49.5%,#e4b878 50%) top/100% 55% no-repeat;border-radius:8px}
.seal{position:absolute;left:50%;top:48%;transform:translate(-50%,-50%);width:58px;height:58px;border-radius:50%;background:var(--b);display:flex;align-items:center;justify-content:center;font-size:28px;box-shadow:0 3px 8px #0005;transition:.4s}
.env.broken .seal{transform:translate(-50%,-50%) scale(0);opacity:0}
.letter{background:#fffdf5;border-radius:14px;padding:18px;font-family:'Shantell Sans';font-size:16.5px;line-height:1.55;text-align:left;white-space:pre-wrap;width:100%;border:1px solid #f0e3c4;box-shadow:0 4px 14px #0001}
.rule{display:flex;gap:10px;align-items:center;text-align:left;padding:12px;border:1.5px solid #dbe7e2;border-radius:12px;width:100%;cursor:pointer;font-weight:500;background:#fff;font:inherit}
.rule .bx{width:24px;height:24px;border-radius:7px;border:2px solid #b8cbc4;flex:none;display:flex;align-items:center;justify-content:center;color:#fff;font-size:15px}.rule.on{background:#effaf6;border-color:var(--c)}.rule.on .bx{background:var(--c);border-color:var(--c)}
canvas.sig{width:100%;height:150px;background:#fff;border:2px dashed #b8cbc4;border-radius:12px;touch-action:none}
.cert{border:3px double var(--acc);border-radius:16px;padding:18px;width:100%;background:#fffdf7}
.cert big{font-family:'Bricolage Grotesque';font-size:22px;font-weight:800;display:block;margin:6px 0}
.stats{display:flex;gap:8px;justify-content:center;margin-top:10px}.stats div{background:#f2f8f6;padding:8px 12px;border-radius:10px;font-size:12px}.stats b{display:block;font-size:18px}
.confetti{position:fixed;top:-20px;font-size:22px;animation:fall linear forwards;z-index:9;pointer-events:none}@keyframes fall{to{transform:translateY(110vh) rotate(500deg)}}
.share{width:100%;font:inherit;font-size:12px;padding:10px;border:1.5px solid #dbe7e2;border-radius:10px}

/* ---- v2 design ---- */
body{background:radial-gradient(circle at 15% 10%,#fff6 0,transparent 40%),radial-gradient(circle at 85% 90%,var(--bg2) 0,transparent 50%),linear-gradient(135deg,var(--bg1),var(--bg2));background-attachment:fixed}
.fl{position:absolute;bottom:-10vh;font-size:26px;opacity:.7;animation:rise linear infinite;filter:drop-shadow(0 3px 4px #0002)}
.card,.room{border:2px solid #fff;background:linear-gradient(#fff,#fffdf8);position:relative;overflow:hidden}
.card::before,.room::before{content:"";position:absolute;left:0;right:0;top:0;height:6px;background:linear-gradient(90deg,var(--a),var(--b),var(--e),var(--d),var(--c))}
.card::after{content:"✨";position:absolute;right:14px;top:16px;font-size:20px;animation:tw 2s infinite}
@keyframes tw{50%{transform:scale(1.3) rotate(15deg);opacity:.6}}
h1,.room h2{background:linear-gradient(90deg,var(--ink),var(--ink) 60%,var(--acc2));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
h1 em{-webkit-text-fill-color:var(--acc)}
.btn{box-shadow:0 6px 0 #0002,0 10px 18px #0001;position:relative;overflow:hidden}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #0002}
.btn::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(90deg,transparent,#fff7,transparent);transform:skewX(-20deg);animation:shine 3s infinite}
@keyframes shine{to{left:130%}}
.btn.ghost::after{display:none}
.tile:hover,.opt:hover,.pill:hover{transform:translateY(-2px) rotate(-1deg)}
.tile span:first-child{font-size:30px;animation:bob 3s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
.rico{font-size:54px;animation:bob 2.5s ease-in-out infinite;filter:drop-shadow(0 6px 6px #0002)}
.note::before{content:"📌";position:absolute;margin:-26px 0 0 -8px}.note{position:relative;margin-top:12px}
.frame{position:relative}.frame::after{content:"🌟";position:absolute;right:-6px;top:-8px;font-size:22px}
.cert{background:repeating-linear-gradient(45deg,#fffdf7,#fffdf7 12px,#fff8e6 12px,#fff8e6 24px)}
.reply textarea{min-height:70px;margin-top:8px}
.dash{width:100%;max-width:640px;background:#fff;border-radius:22px;padding:22px;box-shadow:0 20px 60px #17332d22}
.dash table{width:100%;border-collapse:collapse;font-size:13px;margin:8px 0 14px}.dash td,.dash th{border-bottom:1px solid #e3ece8;padding:7px 5px;text-align:left;vertical-align:top}
.dash .tools{display:flex;gap:8px;flex-wrap:wrap}.dash .tools .btn{margin:0;width:auto;padding:10px 14px;font-size:13px}
.bill{border:2px dashed var(--acc);border-radius:16px;padding:14px 16px;background:#fffdf7;margin-bottom:6px}
.bill-h{display:flex;justify-content:space-between;gap:10px;font-size:15px;border-bottom:1px solid #f0e3c4;padding-bottom:10px;margin-bottom:8px}.bill-h b:last-child{font-family:'Bricolage Grotesque';font-size:22px;color:var(--acc2)}
.bill ul{list-style:none;padding:0;font-size:14px;display:grid;gap:6px}
.lg{position:relative;z-index:1;text-align:center;font-size:12px;color:var(--mut);padding:0 12px 18px}.lg a{color:var(--mut);margin:0 4px}
[data-vibe=bday]{--bg1:#ffe3ee;--bg2:#fff1d6;--acc:#E14B8A;--acc2:#F5A524}
.balrow{display:flex;gap:8px;align-items:center;margin-bottom:8px}.balrow input{flex:1}.balrow small{color:var(--mut);font-size:11px;width:38px;text-align:right}
.cake{position:relative;width:210px;height:190px;margin:10px auto 0;--ck1:#5a3321;--ck2:#7b4a30;--ck3:#3a2014}
.cake[data-cake=straw]{--ck1:#ff9fb5;--ck2:#ffc2d1;--ck3:#fff}.cake[data-cake=van]{--ck1:#f3d38a;--ck2:#fae6b1;--ck3:#fffaf0}
.cake .l1{position:absolute;bottom:0;left:0;right:0;height:78px;border-radius:16px;background:var(--ck1);box-shadow:0 10px 18px #0003}
.cake .l2{position:absolute;bottom:70px;left:26px;right:26px;height:58px;border-radius:14px;background:var(--ck2)}
.cake .ic{position:absolute;bottom:116px;left:22px;right:22px;height:16px;border-radius:12px;background:var(--ck3)}
.candle{position:absolute;bottom:128px;left:50%;width:12px;height:42px;margin-left:-6px;background:repeating-linear-gradient(45deg,#fff,#fff 6px,var(--b) 6px,var(--b) 12px);border-radius:3px;cursor:pointer}
.candle::before{content:"";position:absolute;inset:-14px -22px}
.flame{display:none;position:absolute;top:-26px;left:50%;margin-left:-8px;width:16px;height:25px;border-radius:50% 50% 50% 50%/62% 62% 38% 38%;background:radial-gradient(#fff 10%,#ffd23f 50%,#ff8c1a);animation:flk .15s infinite alternate;box-shadow:0 0 18px 6px #ffb34766}
.lit .flame{display:block}@keyframes flk{to{transform:scale(1.1,.9) rotate(4deg)}}
.sliced{font-size:120px;animation:pop .4s}
.bals{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;padding:6px 0 12px}
.bal{position:relative;width:62px;height:76px;border-radius:50% 50% 48% 48%;cursor:pointer;animation:flt 3s ease-in-out infinite;box-shadow:inset -8px -10px 0 #0002,0 6px 10px #0002;display:flex;align-items:center;justify-content:center;font-size:32px}
.bal::after{content:"";position:absolute;bottom:-26px;left:50%;width:2px;height:26px;background:#0003}
.bal.pop{background:none!important;box-shadow:none;animation:none}.bal.pop::after{display:none}
@keyframes flt{50%{transform:translateY(-10px) rotate(2deg)}}
.lights{display:flex;gap:10px;justify-content:center;width:100%;border-top:2px solid #0003;padding-top:2px;margin-top:-6px}
.lights i{width:11px;height:15px;border-radius:50%;background:var(--a);animation:glow 1.6s infinite alternate}.lights i:nth-child(3n){background:var(--b);animation-delay:.3s}.lights i:nth-child(3n+1){background:var(--e);animation-delay:.7s}
@keyframes glow{from{opacity:.35}to{opacity:1;box-shadow:0 0 12px currentColor}}
.mm{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:100%;max-width:320px;margin:4px auto}
.mc{aspect-ratio:1;border:0;border-radius:14px;background:linear-gradient(135deg,var(--acc),var(--acc2));font-size:30px;cursor:pointer;color:#fff;box-shadow:0 4px 0 #0002;display:flex;align-items:center;justify-content:center;transition:transform .15s}
.mc:active{transform:scale(.94)}.mc .mb{display:none}.mc.up .mf,.mc.ok .mf{display:none}.mc.up .mb,.mc.ok .mb{display:inline}
.mc.up{background:#fff7e6;box-shadow:0 0 0 2px var(--acc) inset}.mc.ok{background:#effaf6;box-shadow:0 0 0 2px var(--c) inset;animation:pop .3s}

/* ---- birthday v3: party environment ---- */
#bdenv{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0;display:none}
body.bd-env #bdenv{display:block}body.bd-env #bg{display:none}
body.bd-env{background:radial-gradient(circle at 12% 8%,#fff8 0,#0000 38%),radial-gradient(circle at 88% 92%,#ffe08a99 0,#0000 45%),linear-gradient(135deg,#ffd6e8,#fff0d1 55%,#ffe9a8);background-attachment:fixed}
body.bd-env .shell{padding-top:64px}
.bunting{position:absolute;top:0;left:0;right:0;height:60px;display:flex;justify-content:space-around;border-top:3px solid #ffffffaa}
.bunting i{width:0;height:0;border-left:22px solid #0000;border-right:22px solid #0000;border-top:44px solid var(--c);margin-top:-2px;filter:drop-shadow(0 3px 2px #0002);transform-origin:50% 0;animation:swing 3s ease-in-out infinite alternate}
.bunting i:nth-child(even){animation-delay:-1.2s}@keyframes swing{from{transform:rotate(-5deg)}to{transform:rotate(5deg)}}
.bb{position:absolute;bottom:-16vh;width:46px;height:58px;border-radius:50% 50% 48% 48%;background:radial-gradient(circle at 30% 26%,#fffa 0,#fff0 26%),var(--c);box-shadow:inset -6px -8px 0 #0002;animation:riseb linear infinite;opacity:.85}
.bb::after{content:"";position:absolute;bottom:-24px;left:50%;width:2px;height:24px;background:#0003}
@keyframes riseb{50%{transform:translate(20px,-62vh)}to{transform:translate(-8px,-128vh)}}
.cf{position:absolute;top:-6vh;width:9px;height:14px;border-radius:2px;background:var(--c);opacity:.85;animation:fallc linear infinite}
@keyframes fallc{to{transform:translateY(112vh) rotate(560deg)}}
body.bd-env .room,body.bd-env .card{border:2px solid #fff;box-shadow:0 18px 50px #e14b8a33}
/* ---- new cake + candles ---- */
.cake2{position:relative;width:260px;height:250px;margin:6px auto 0;--ck1:#5a3321;--ck2:#7b4a30;--ck3:#3a2014;transition:filter .4s}
.cake2[data-cake=straw]{--ck1:#ff9fb5;--ck2:#ffc2d1;--ck3:#fff}.cake2[data-cake=van]{--ck1:#f3d38a;--ck2:#fae6b1;--ck3:#fffaf0}
.cake2.glow{filter:drop-shadow(0 0 26px #ffb3478f)}
.cake2 .plate{position:absolute;bottom:0;left:-10px;right:-10px;height:16px;border-radius:50%;background:linear-gradient(#fff,#d6dbe2);box-shadow:0 8px 14px #0003}
.cake2 .t1,.cake2 .t2{position:absolute;background:var(--ck1);overflow:hidden;box-shadow:inset 0 -10px 0 #0002}
.cake2 .t1{bottom:10px;left:6px;right:6px;height:90px;border-radius:16px 16px 12px 12px}
.cake2 .t2{bottom:94px;left:46px;right:46px;height:68px;border-radius:14px;background:var(--ck2)}
.cake2 .t1::before,.cake2 .t2::before{content:"";position:absolute;left:0;right:0;top:0;height:30px;background:radial-gradient(circle at 14px 24px,var(--ck3) 12px,#0000 13px) 0 0/28px 30px repeat-x,linear-gradient(var(--ck3),var(--ck3)) 0 0/100% 16px no-repeat}
.cake2 .t1::after{content:"";position:absolute;inset:36px 0 0;background:radial-gradient(circle,#ff6b57 2px,#0000 3px) 6px 4px/34px 22px,radial-gradient(circle,#ffd166 2px,#0000 3px) 20px 14px/34px 22px,radial-gradient(circle,#4cc9f0 2px,#0000 3px) 30px 6px/34px 22px}
.cdrow{position:absolute;bottom:158px;left:30px;right:30px;display:flex;justify-content:center;align-items:flex-end;gap:5px;z-index:2}

function beep(f=520,d=.12,t='sine',v=.08){if(muted)return;try{actx=actx||new(window.AudioContext||window.webkitAudioContext)();if(actx.state=='suspended')actx.resume();const o=actx.createOscillator(),g=actx.createGain();o.type=t;o.frequency.value=f;g.gain.value=v;g.gain.exponentialRampToValueAtTime(.0001,actx.currentTime+d);o.connect(g).connect(actx.destination);o.start();o.stop(actx.currentTime+d)}catch(e){}}
const chime=()=>[523,659,784,1047].forEach((f,i)=>setTimeout(()=>beep(f,.25),i*110));
$('#mute').onclick=()=>{muted=!muted;$('#mute').textContent=muted?'🔇':'🔊';if(MUS.g)MUS.g.gain.value=muted?0:MUS_VOL};
function confetti(n=40){const em=['🎉','💛','✨','🧡','💫','🎊'];for(let i=0;i<n;i++){const e=document.createElement('span');e.className='confetti';e.textContent=em[i%em.length];e.style.left=Math.random()*100+'vw';e.style.animationDuration=2+Math.random()*2.5+'s';document.body.appendChild(e);setTimeout(()=>e.remove(),5000)}}

  else if(d.act=='next'){S.step=stepMove(S.step,1);wiz()}
  else if(d.act=='prev'){S.step=stepMove(S.step,-1);wiz()}
  else if(d.act=='addnote'){const v=$('#f-cn').value.trim();if(v){if(!S.notes.includes(v)&&S.notes.length<5)S.notes.push(v);wiz()}}
  else if(d.act=='addrule'){const v=$('#f-cr').value.trim();if(v){if(!S.rules.includes(v)&&S.rules.length<5)S.rules.push(v);wiz()}}
  else if(d.act=='preview')startMuseum(S,true);

});

  <div class="tools"><button class="btn" id="ej">⬇ Export JSON</button><button class="btn" id="ec">⬇ Export CSV</button><button class="btn ghost" id="cl">🗑 Clear all</button><button class="btn ghost" id="bk">← Back</button></div></div>`;

function tog(a,v,max){const i=a.indexOf(v);if(i>=0)a.splice(i,1);else if(a.length<max)a.push(v)}
function addPhotos(files){
  files.slice(0,(S.type=='bday'?ST.b_maxPhotos:ST.f_maxPhotos)-S.photos.length).forEach(f=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{
    const m=Math.min(im.width,im.height),c=document.createElement('canvas');c.width=c.height=400;
    c.getContext('2d').drawImage(im,(im.width-m)/2,(im.height-m)/2,m,m,0,0,400,400);
    S.photos.push({src:c.toDataURL('image/jpeg',.55),cap:''});wiz()};im.src=r.result};r.readAsDataURL(f)});
}
function pay(){
  const st=$('#payst');
  if(typeof Razorpay==='undefined'){st.textContent='Payment could not load. Check your internet and try again.';return}
  try{
    const rz=new Razorpay({
      key:CONFIG.RZP_KEY,amount:Math.round(CONFIG.PRICE_INR*100),currency:'INR',
      name:'OurMoments',description:(S.type=='bday'?'Birthday Surprise for ':'Friendship Museum for ')+S.name,theme:{color:'#F5A524'},
      handler:r=>{S.payId=r.razorpay_payment_id;S.step=S.type=='bday'?6:8;wiz();makeLink()}, // paid: go back and create the link
      modal:{ondismiss:()=>{st.textContent='Payment cancelled. You can try again.'}}
    });
    rz.on('payment.failed',e=>{st.textContent='Payment failed: '+((e.error&&e.error.description)||'please try again')});
    rz.open();
  }catch(e){st.textContent='Could not start payment: '+e.message}
}

async function idt(){   // a fresh login token (renewed quietly when it is getting old)
  if(!ME)throw new Error('Please log in first.');
  if(Date.now()-(ME.at||0)>50*60*1000){
    const r=await fetch('https://securetoken.googleapis.com/v1/token?key='+CONFIG.FIREBASE_KEY,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'grant_type=refresh_token&refresh_token='+encodeURIComponent(ME.refreshToken)});
    if(!r.ok){ME=null;saveMe();refreshAcctBtn();throw new Error('Your session expired. Please log in again.')}
    const j=await r.json();ME.idToken=j.id_token;ME.refreshToken=j.refresh_token;ME.at=Date.now();saveMe();
  }
  return ME.idToken;
}
async function authCall(ep,body){
  const r=await fetch('https://identitytoolkit.googleapis.com/v1/accounts:'+ep+'?key='+CONFIG.FIREBASE_KEY,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  const j=await r.json().catch(()=>({}));
  if(!r.ok){const m=(j.error&&j.error.message)||'',k=Object.keys(AUTHMSG).find(x=>m.startsWith(x));throw new Error(AUTHMSG[k]||'Something went wrong ('+(m||r.status)+').')}
  return j;
}
async function api(path,body){
  const t=await idt();
  const r=await fetch(CONFIG.API.replace(/\/+$/,'')+path,{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+t},body:JSON.stringify(body||{})});
  const j=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(j.error||'Server error ('+r.status+')');
  return j;
}
async function dbMy(path){const t=await idt(),r=await fetch(CONFIG.DB.replace(/\/+$/,'')+'/'+path+'.json?auth='+encodeURIComponent(t));if(!r.ok)throw new Error('Could not load your data ('+r.status+').');return r.json()}

async function recoverCheck(){
  if(!ME||!apiOn())return;
  try{
    let codes=[];
    try{const p=JSON.parse(localStorage.getItem('om_pending')||'null');if(p){const r=await api('/api/complete',p);codes.push(r.code);localStorage.removeItem('om_pending')}}catch(e){}
    const r=await api('/api/recover');codes=codes.concat(r.codes||[]);
    if(codes.length)showRecovered(codes);
  }catch(e){/* try again next time */}
}
function showRecovered(codes){
  const old=$('.rcvbar');if(old)old.remove();
  const b=document.createElement('div');b.className='rcvbar';
  b.innerHTML='✅ Your payment went through. Here is your gift link:<input readonly value="'+esc(linkFor(codes[0]))+'"><button id="rcv-x">OK</button>';

function payBlock(){return apiOn()?`<div id="walletbox"></div><button class="btn" data-act="pay" id="paybtn">🔒 Pay ${money(CONFIG.PRICE_INR)} securely</button><p class="hint" id="payst">Secured by Razorpay · UPI, cards, netbanking & wallets</p>`

async function loadQuote(){
  const box=$('#walletbox'),btn=$('#paybtn'),st=$('#payst');if(!box||!btn)return;
  if(!ME){btn.textContent='Log in to continue';return}
  try{
    const q=await api('/api/quote');QUOTE=q;
    if(q.paused){box.innerHTML='<p class="hint">⏸️ New gifts are paused for a little while. Please try again later.</p>';btn.disabled=true;return}
    if(q.admin||q.free){box.innerHTML=`<div class="bx2">${q.admin?'👑 Admin: no payment needed':'🎁 Free right now: no payment needed'}</div>`;btn.textContent='✨ Create my link';st.textContent='';return}
    const use=q.walletPay&&q.balance>0;
    box.innerHTML=use?`<label class="sw2"><input type="checkbox" id="usew" checked><span><b>Use my wallet</b><small>Balance ${money(q.balance)} · covers ${money(Math.min(q.balance,q.price))} of ${money(q.price)}</small></span></label>`:'';
    const upd=()=>{const w=use&&$('#usew').checked?Math.min(q.balance,q.price):0,rem=q.price-w;btn.textContent=rem>0?`🔒 Pay ${money(rem)} securely`:'✨ Pay with my wallet';st.textContent=rem>0?'Secured by Razorpay · UPI, cards, netbanking & wallets':'Paid from your wallet balance'};
    if(use)$('#usew').onchange=upd;upd();
  }catch(e){st.textContent=e.message}

async function payServer(){
  const st=$('#payst'),btn=$('#paybtn');
  if(!ME){AUTHRET='checkout';return acctView('login')}
  btn.disabled=true;st.textContent='Please wait…';
  try{
    const r=await api('/api/checkout',{draft:prepDraft(),walletUse:!!($('#usew')&&$('#usew').checked)});
    if(r.code)return finishDone(r.code);
    if(typeof Razorpay==='undefined')throw new Error('Payment could not load. Check your internet and try again.');
    const rz=new Razorpay({key:r.key,order_id:r.orderId,amount:r.amount,currency:'INR',name:'OurMoments',description:(S.type=='bday'?'Birthday Surprise for ':'Friendship Museum for ')+S.name,theme:{color:'#F5A524'},prefill:{name:ME.name,email:ME.email},
      handler:resp=>completeOrder({orderId:resp.razorpay_order_id,paymentId:resp.razorpay_payment_id,signature:resp.razorpay_signature}),
      modal:{ondismiss:()=>{btn.disabled=false;st.textContent='Payment cancelled. You can try again.'}}});
    rz.on('payment.failed',e=>{btn.disabled=false;st.textContent='Payment failed: '+((e.error&&e.error.description)||'please try again')});
    rz.open();
  }catch(e){btn.disabled=false;st.textContent=e.message}
}
async function completeOrder(p){
  try{localStorage.setItem('om_pending',JSON.stringify(p))}catch(e){}
  S.step=reviewStep();wiz();const out=$('#out');out.innerHTML='<p class="hint">⏳ Payment received. Creating your link…</p>';
  try{finishDone((await api('/api/complete',p)).code)}
  catch(e){out.innerHTML=`<p class="hint">We received your payment but could not finish just yet: ${esc(e.message)}</p><button class="btn" id="retry">Try again</button><p class="hint">Please do not pay again. Your link is safe, and it will also appear under your account.</p>`;$('#retry').onclick=()=>completeOrder(p)}
}
function finishDone(code){
  try{localStorage.removeItem('om_pending')}catch(e){}
  S.code=code;S.step=reviewStep();wiz();showLink($('#out'),linkFor(code),true,'');
}

// A link name is the recipient's name made web-safe: "José Ángel" -> "jose-angel". Names with no Latin letters fall back to "gift".
const slug=s=>String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,20).replace(/-+$/,'');
const linkBase=()=>slug(S.linkName)||slug(S.name)||'gift';
// 5 random characters are always added, so nobody can guess a link just by knowing a name
const rand5=()=>{let r='';while(r.length<5)r+=Math.random().toString(36).slice(2);return r.slice(0,5)};
const linkPreview=()=>(CONFIG.PRETTY?'…/':'…/#c=')+linkBase()+'-xxxxx';
const linkField=()=>CONFIG.DB&&!S.code?`<label>Link name <small>— the recipient’s name in the web address</small></label><input type="text" id="f-ln" maxlength="20" placeholder="e.g. ${esc(slug(S.name)||'sam')}" value="${esc(S.linkName||'')}"><p class="hint">Your link will look like <b id="lnp">${esc(linkPreview())}</b></p>`:'';
shell.addEventListener('input',e=>{const t=e.target;if(t.id!='f-ln')return;S.linkName=slug(t.value);const p=$('#lnp');if(p)p.textContent=linkPreview()});
async function makeLink(){
  if(!S.id)S.id=uid();
  if(!S.created)S.created=new Date().toISOString();
  if(!S.payId&&!payOn())S.payId=CONFIG.ADMIN?'ADMIN':'FREE';   // no payment taken: mark why
  applyForced();
  {const rc0=refCode();if(rc0&&/^pay_/.test(S.payId||''))S.ref=rc0}
  const out=$('#out'),base=location.href.split('#')[0];
  if(!S.recorded){S.recorded=1;const rec={id:S.id,type:S.type,name:S.name,from:S.from,kind:S.kind,vibe:S.vibe,pay:S.payId||'',created:new Date().toISOString()};dbAdd(CONFIG.KEY_GIFTS,rec)}
let url,short=false,err='';
  if(CONFIG.DB){
    out.innerHTML='<p class="hint">⏳ Saving your gift online…</p>';
    // The link is shown only after the database confirms it saved. A code that is already taken is refused by the Rules, so we retry.
    for(let t=0;t<4&&!short;t++){
      const code=linkBase()+'-'+rand5();
      try{await fb('PUT','gifts/'+code,S);url=CONFIG.PRETTY?base.split('?')[0].replace(/[^/]*$/,'')+code:base+'#c='+code;short=true;S.code=code;recordReferral(code);fb('PUT','index/'+code,{id:S.id,type:S.type||'friend',name:S.name,from:S.from,created:S.created,pay:S.payId||''}).catch(()=>{})}
      catch(e){err=String(e.message||e)}
    }
  }
  if(!short)url=base+'#g='+btoa(unescape(encodeURIComponent(JSON.stringify(S))));
  showLink(out,url,short,err);
}
function applyForced(){
  if(S.type=='bday'){if(ST.b_game=='on')S.game=true;if(ST.b_game=='off')S.game=false;const al=allowedSongs();if(al.length&&!al.some(x=>x[0]==S.song))S.song=al[0][0]}
  else{S.puzzle=ST.f_puzzle!==false;S.quiz=ST.f_quiz?cleanQuiz(S.quiz):[];S.story=ST.f_story?cleanStory(S.story):[];S.awards=ST.f_awards?(S.awards||[]):[];const af=allowedFSongs();if(af.length&&!af.some(x=>x[0]==S.fsong))S.fsong=af[0][0]}

const SONGS=[['bday','🎂','Happy Birthday','The classic song'],['box','🎶','Music Box','Soft & sweet'],['pop','🎉','Party Pop','Upbeat & fun'],['dance','🪩','Dance Beat','Feel the beat'],['none','🔇','No music','Just the surprise']];
const BOX=[[523.25,659.25,783.99,1046.5],[440,523.25,659.25,880],[349.23,440,523.25,698.46],[392,493.88,587.33,783.99]];
const POP_LEAD=[659.25,659.25,783.99,659.25,587.33,587.33,783.99,587.33,523.25,523.25,659.25,523.25,587.33,659.25,587.33,523.25];
const POP_BASS=[130.81,98,110,87.31],POP_CH=[[261.63,329.63,392],[196,246.94,293.66],[220,261.63,329.63],[174.61,220,261.63]];
const DANCE_BASS=[110,87.31,130.81,98],DANCE_ARP=[[440,523.25,659.25,523.25],[349.23,440,523.25,440],[523.25,659.25,783.99,659.25],[392,493.88,587.33,493.88]];
function mkick(at,v){try{const c=actx,o=c.createOscillator(),g=c.createGain();o.type='sine';o.frequency.setValueAtTime(150,at);o.frequency.exponentialRampToValueAtTime(42,at+.14);g.gain.setValueAtTime(v||.45,at);g.gain.exponentialRampToValueAtTime(.001,at+.2);o.connect(g);g.connect(MUS.g);o.start(at);o.stop(at+.22)}catch(e){}}
function mhat(at,vol){try{mnote(9000,at,.04,'square',vol||.03)}catch(e){}}
// schedules one loop of a song starting at t0 and returns its length in seconds
function songLoop(track,t0){
  if(track=='bday'){
    const beat=.55;let t=t0;
    HB.forEach(n=>{mnote(n[0],t,n[1]*beat*.95,'triangle',.11);mnote(n[0]*2,t,n[1]*beat*.6,'sine',.025);t+=n[1]*beat});
    HB_BASS.forEach((b,i)=>{mnote(b[0],t0+i*6*beat,2.8*beat,'sine',.07);mnote(b[1],t0+(i*6+3)*beat,2.8*beat,'sine',.05)});
    return 26*beat;
  }
  if(track=='box'){ // music box: bright, plucked arpeggios
    const step=.34;
    BOX.forEach((ch,i)=>[0,1,2,3,2,1,2,1].forEach((k,j)=>{const at=t0+(i*8+j)*step;mnote(ch[k],at,1.1,'sine',.09);mnote(ch[k]*2,at,.45,'sine',.02)}));
    return 32*step;
  }
  if(track=='pop'){ // upbeat pop loop, 4 bars
    const beat=.46;
    for(let bar=0;bar<4;bar++){
      const b0=t0+bar*4*beat;
      [0,2].forEach(k=>mnote(POP_BASS[bar],b0+k*beat,beat*.9,'triangle',.12));
      [1,3].forEach(k=>POP_CH[bar].forEach(f=>mnote(f,b0+k*beat,beat*.5,'triangle',.05)));
      for(let k=0;k<4;k++){mnote(POP_LEAD[bar*4+k],b0+k*beat,beat*.85,'triangle',.1);mnote(POP_LEAD[bar*4+k],b0+k*beat,beat*.5,'square',.02);mhat(b0+(k+.5)*beat)}
    }
    return 16*beat;
  }
  if(track=='dance'){ // four-on-the-floor dance beat
    const beat=.47;
    for(let bar=0;bar<4;bar++){
      const b0=t0+bar*4*beat;
      for(let k=0;k<4;k++){mkick(b0+k*beat);mhat(b0+(k+.5)*beat,.04);if(k%2==1)mhat(b0+k*beat,.05)}
      for(let k=0;k<8;k++){mnote(DANCE_BASS[bar],b0+k*beat/2,beat*.4,'sawtooth',.05);mnote(DANCE_ARP[bar][k%4],b0+k*beat/2,beat*.42,'square',.03)}
    }
    return 16*beat;
  }
  if(track=='lofi'){ // lo-fi chill: lazy chords, soft drums, simple melody
    const beat=.75,CH=[[174.61,220,261.63,329.63],[164.81,196,246.94,293.66],[146.83,174.61,220,261.63],[130.81,164.81,196,246.94]];
    const MEL=[[392,329.63,392,440],[329.63,293.66,329.63,392],[293.66,261.63,293.66,329.63],[261.63,293.66,329.63,261.63]];
    for(let bar=0;bar<4;bar++){
      const b0=t0+bar*4*beat;
      CH[bar].forEach(f=>mnote(f,b0,3.7*beat,'triangle',.032));
      [0,2].forEach(k=>mkick(b0+k*beat,.28));[1,3].forEach(k=>mnote(180,b0+k*beat,.09,'square',.03));
      for(let k=0;k<8;k++)mhat(b0+k*beat/2,.016);
      MEL[bar].forEach((f,k)=>mnote(f,b0+k*beat+.05,beat*.9,'sine',.07));
    }
    return 16*beat;
  }
  // 'calm' (friendship museum)
  const step=.45;
  CALM.forEach((ch,i)=>{
    const base=t0+i*8*step;
    mnote(ch[0]/2,base,8*step,'sine',.05);
    [0,1,2,3,2,1,2,3].forEach((k,j)=>mnote(ch[k],base+j*step,step*1.6,'triangle',.06));
  });
  return 32*step;
}
function musicStart(track){
  musicStop();
  if(!track||track=='none'||!ctx())return;
  MUS.on=true;MUS.track=track;
  MUS.g=actx.createGain();MUS.g.gain.value=muted?0:MUS_VOL;MUS.g.connect(actx.destination);
  const loop=()=>{
    if(!MUS.on||!MUS.g)return;
    const len=songLoop(track,actx.currentTime+.1);
    MUS.t=setTimeout(loop,Math.max(500,len*1000-300));
  };
  loop();
}
function musicStop(){
  MUS.on=false;clearTimeout(MUS.t);
  if(MUS.g){try{MUS.g.gain.setTargetAtTime(0,actx.currentTime,.12)}catch(e){}MUS.g=null}
}

/* ---------- referral program: a "Refer & earn" button on the first screen, a referral box at the finale; people sign up on refer.html; admin verifies and pays by UPI ---------- */
const REF_DAYS=30;
const REFERRAL_ENABLED=true;    // referral links are tracked silently; the admin dashboard is the only place they show
const REF_UI=false;             // no referral button, boxes or banners anywhere on the public site
let REFSET={on:true,reward:20,every:false};   // replaced by the admin's settings (settings/refer)
const rKey=n=>{let r='';try{const a=new Uint8Array(n);crypto.getRandomValues(a);r=Array.from(a,b=>(b%36).toString(36)).join('')}catch(e){while(r.length<n)r+=Math.random().toString(36).slice(2);r=r.slice(0,n)}return r};
// the account of the person using this browser (made on refer.html; shared with wallet.html through localStorage)
const acct=()=>{try{const a=JSON.parse(localStorage.getItem('om_acct')||'null');return a&&a.uid&&a.rcode?a:null}catch(e){return null}};
const refRec=()=>{try{const r=JSON.parse(localStorage.getItem('om_sref')||'null');return r&&r.c&&Date.now()-r.t<REF_DAYS*864e5?r:null}catch(e){return null}};
// the referral that should be credited for a gift made in this browser ('' = none). You can't refer yourself.
const refCode=()=>{if(!REFERRAL_ENABLED)return '';const r=refRec();if(!r||REFSET.on===false)return '';const a=acct();if(a&&a.rcode===r.c)return '';if(r.used&&!REFSET.every)return '';return r.c};
const siteDir=()=>location.href.split('#')[0].split('?')[0].replace(/[^/]*$/,'');
const refLinkOf=rc=>siteDir()+'index.html#ref='+rc;
const referUrl=()=>siteDir()+'refer.html';
const walletUrl=()=>siteDir()+'wallet.html';
// someone opened a referral link: remember who invited them (the first referrer wins, for 30 days)
async function captureRef(code){
  if(!REFERRAL_ENABLED)return;
  try{
    if(!CONFIG.DB||refRec())return;
    const rr=await fb('GET','referrers/'+code);if(!rr||!rr.name)return;
    localStorage.setItem('om_sref',JSON.stringify({c:code,t:Date.now(),n:rr.name}));
  }catch(e){}
}
function refChip(){
  if(!REF_UI)return;
  const r=refRec();if(!r||!r.n||REFSET.on===false||document.querySelector('.refbar'))return;
  const b=document.createElement('div');b.className='refbar';b.textContent='🎁 Invited by '+r.n;document.body.appendChild(b);
}
// the small "Refer & earn" button, shown only while someone is building a gift (not while a gift is being opened)
function refreshRefPill(){
  let p=$('#refpill');
  if(!REF_UI||!CONFIG.DB||REFSET.on===false||V){if(p)p.style.display='none';return}
  if(!p){p=document.createElement('a');p.id='refpill';p.className='fix';p.textContent='💰 Refer & earn';document.body.appendChild(p)}
  p.href=referUrl();p.style.display='block';
}
const hideRefPill=()=>{const p=$('#refpill');if(p)p.style.display='none'};
// called right after a gift link is saved: counts as one referral for whoever invited this person
async function recordReferral(giftCode){
  try{
    if(!REFERRAL_ENABLED||!CONFIG.DB||S.refDone||!/^pay_[A-Za-z0-9]+$/.test(S.payId||''))return;
    const rc=refCode();if(!rc)return;
    if(!(await fb('GET','referrers/'+rc)))return;                                // the referrer must still exist
    S.refDone=1;
    const rid=rKey(10),t=Date.now();
    await fb('PUT','refpay/'+S.payId,{r:rid,t});                                  // one payment can only ever count once
    await fb('PUT','referrals/'+rc+'/'+rid,{t,st:'pending'});                      // waits for the admin to verify the payment
    await fb('PUT','refaudit/'+rid,{rcode:rc,pay:S.payId,gift:giftCode,name:S.name,from:S.from,type:S.type||'friend',t});
    const r=refRec();if(r){r.used=true;localStorage.setItem('om_sref',JSON.stringify(r))}
  }catch(e){}
}
function referBoxHtml(){
  return REF_UI&&CONFIG.DB?`<div class="refer" id="refer" style="display:none"><b>💰 Earn ₹<span class="rw">20</span> for every friend who makes a gift</b><small>Sign up free, share your link, and earn ₹<span class="rw">20</span> each time a friend pays and creates a gift with it. Withdraw to UPI from ₹<span id="rf-min">20</span>.</small><div id="rf-out"></div></div>`:'';
}
async function bindRefer(){
  const box=$('#refer');if(!REF_UI||!box)return;
  try{const st=await fb('GET','settings/refer');if(st&&typeof st=='object')Object.assign(REFSET,st)}catch(e){}
  if(REFSET.on===false||!$('#refer'))return;
  box.querySelectorAll('.rw').forEach(e=>e.textContent=REFSET.reward);$('#rf-min').textContent=REFSET.min;box.style.display='';
  const a=acct(),out=$('#rf-out');

    const rl=refLinkOf(a.rcode),txt='🎁 Make a personalised gift for someone you love with my link: '+rl;
    out.innerHTML=`<label>Your referral link</label><input class="share" readonly value="${rl}" onclick="this.select()"><div class="row"><button class="btn ghost" id="rf-cp">📋 Copy</button><a class="btn" style="text-align:center;text-decoration:none" target="_blank" rel="noopener" href="https://wa.me/?text=${encodeURIComponent(txt)}">💬 Share on WhatsApp</a></div><p class="hint"><a href="${walletUrl()}">Open my wallet</a> to see earnings and withdraw to UPI.</p>`;
    $('#rf-cp').onclick=()=>navigator.clipboard.writeText(rl).then(()=>{$('#rf-cp').textContent='Copied ✓'}).catch(()=>{});
  }else{
    out.innerHTML=`<a class="btn" id="rf-go" style="display:block;text-align:center;text-decoration:none" href="${referUrl()}">🔐 Sign up or log in to start earning</a>`;
  }
}

/* ---------- admin bypass: a signed-in admin (from admin.html) can create gifts without paying ---------- */
async function adminCheck(){
  try{
    if(sessionStorage.getItem('om_noadmin'))return;
    const a=JSON.parse(localStorage.getItem('om_admin_tok')||'null');
    if(!a||!a.t||Date.now()-a.at>55*60*1000)return;
    // index/__probe can only be read by the admin account (see the database Rules), so this proves the token is the admin's
    const r=await fetch(CONFIG.DB.replace(/\/+$/,'')+'/index/__probe.json?auth='+encodeURIComponent(a.t));
    if(r.ok){CONFIG.ADMIN=true;const b=document.createElement('div');b.className='admbar';
      b.innerHTML='👑 Admin mode · payment is skipped <button id="adm-off">Test the normal payment flow</button>';document.body.appendChild(b);
      $('#adm-off').onclick=()=>{try{sessionStorage.setItem('om_noadmin','1')}catch(e){}location.reload()}}
  }catch(e){}
}

/* ---------- boot ---------- */
(async()=>{
  const m=location.hash.match(/#g=(.+)/),mc=location.hash.match(/#c=([a-z0-9-]+)/);
  // Live settings from the admin dashboard (price, pause). Never delays the page by more than ~1.2 seconds.
  if(CONFIG.DB&&!m&&!mc){
    shell.innerHTML='<div class="card"><h1>Loading… 🎁</h1></div>';
    try{const st=await Promise.race([fb('GET','settings'),new Promise(r=>setTimeout(()=>r(null),1200))]);
      if(st){
        if(+st.price>0)CONFIG.PRICE_INR=+st.price;CONFIG.PAUSED=!!st.paused;CONFIG.FREE=!!st.free;if(REFERRAL_ENABLED&&st.refer&&typeof st.refer=='object')Object.assign(REFSET,st.refer);
        if(st.steps&&typeof st.steps=='object'){ST=Object.assign(JSON.parse(JSON.stringify(ST_DEFAULT)),st.steps);ST.songs=Object.assign({},ST_DEFAULT.songs,st.steps.songs||{});ST.fsongs=Object.assign({},ST_DEFAULT.fsongs,st.steps.fsongs||{})}
      }}catch(e){}
    if(!apiOn())await adminCheck();
    {const mr=location.hash.match(/#ref=([a-z0-9-]{3,40})/);if(mr)await captureRef(mr[1]);refChip()}
  }
  {const lp=$('#lg-price');if(lp)lp.textContent=payOn()&&!CONFIG.FREE?'One gift link: ₹'+CONFIG.PRICE_INR+' · one-time payment · ':'';}
  if(m){try{const g=JSON.parse(decodeURIComponent(escape(atob(m[1]))));startMuseum(g,false)}catch(e){wiz()}}
  else if(mc&&CONFIG.DB){
    shell.innerHTML='<div class="card"><h1>Opening your gift… 🎁</h1><p class="sub">Just a moment</p></div>';
    let g=null;for(let t=0;t<4&&!g;t++){g=await loadGift(mc[1]);if(!g)await new Promise(r=>setTimeout(r,1500))}
    if(g&&g.disabled)shell.innerHTML='<div class="card"><h1>This gift is unavailable 🔒</h1><p class="sub">This link has been turned off.</p></div>';
    else if(g)startMuseum(g,false);
    else shell.innerHTML='<div class="card"><h1>Gift not found 😢</h1><p class="sub">Ask your friend to send the link again.</p></div>';
  }else{wiz();if(apiOn())recoverCheck()}
})();
})();
</script>
</body>
</html>
