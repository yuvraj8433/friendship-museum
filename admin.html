<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Admin Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#17332d;--mut:#6b8079;--acc:#F5A524;--acc2:#FF6B57;--ok:#14A38B;--bad:#d64545;--line:#e3ece8;--bg:#f3f8f6;--card:#fff}
*{box-sizing:border-box;margin:0}
body{font-family:Outfit,system-ui,sans-serif;color:var(--ink);background:var(--bg);min-height:100vh}
button,input,select,textarea{font:inherit}
.wrap{max-width:1180px;margin:0 auto;padding:18px 14px 60px}
h1{font-family:'Bricolage Grotesque',sans-serif;font-size:26px}
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}.top .sp{flex:1}
.who{font-size:13px;color:var(--mut)}
.btn{border:0;border-radius:10px;padding:9px 14px;font-weight:600;cursor:pointer;background:linear-gradient(90deg,var(--acc),var(--acc2));color:#fff}
.btn.g{background:#e9f1ee;color:var(--ink)}.btn.r{background:#fde8e8;color:var(--bad)}.btn.s{padding:5px 9px;font-size:12px;border-radius:8px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.card{background:var(--card);border-radius:16px;box-shadow:0 6px 24px #17332d14;padding:16px}
.login{max-width:380px;margin:12vh auto 0}.login label{display:block;font-size:13px;font-weight:600;margin:12px 0 4px}
input[type=text],input[type=email],input[type=password],input[type=number],select{width:100%;padding:10px 12px;border:1.5px solid #d6e3de;border-radius:10px;background:#fafdfc}
.err{color:var(--bad);font-size:13px;margin-top:10px;min-height:18px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.stat{background:var(--card);border-radius:14px;padding:12px 14px;box-shadow:0 4px 16px #17332d10}.stat b{display:block;font-family:'Bricolage Grotesque',sans-serif;font-size:26px}.stat span{font-size:12px;color:var(--mut)}
.stat.warn b{color:var(--bad)}.stat.good b{color:var(--ok)}
.tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}.tabs button{border:0;background:#e5eeea;padding:9px 16px;border-radius:99px;font-weight:600;cursor:pointer}.tabs button.on{background:var(--ink);color:#fff}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}.bar input,.bar select{width:auto;flex:1;min-width:130px}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);padding:8px 8px;border-bottom:2px solid var(--line);white-space:nowrap}
td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}tr:hover td{background:#fbfdfc}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:11.5px;font-weight:700}
.pill.ok{background:#dff6ef;color:#0b7a64}.pill.bad{background:#fde8e8;color:var(--bad)}.pill.off{background:#eee;color:#666}.pill.t{background:#fff1cf;color:#a86a00}
.acts{display:flex;gap:5px;flex-wrap:wrap}
a{color:#0f8a74;font-weight:600}
.msg{margin:10px 0;padding:10px 12px;border-radius:10px;background:#e9f6f1;font-size:13.5px}.msg.bad{background:#fde8e8;color:var(--bad)}
.modal{position:fixed;inset:0;background:#0007;display:flex;align-items:flex-start;justify-content:center;padding:30px 14px;overflow:auto;z-index:20}
.modal .card{max-width:640px;width:100%}.modal h2{font-family:'Bricolage Grotesque',sans-serif}
.kv{display:grid;grid-template-columns:140px 1fr;gap:6px 10px;font-size:14px;margin:10px 0}.kv b{color:var(--mut);font-weight:600}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}.thumbs img{width:92px;height:92px;object-fit:cover;border-radius:10px}
.set{display:grid;gap:14px;max-width:520px}.set label{font-weight:600;font-size:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.hidden{display:none!important}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.grp{background:#f8fbfa;border-radius:14px;padding:12px 14px}.grp h3{font-family:'Bricolage Grotesque',sans-serif;font-size:17px;margin-bottom:6px}
.sw{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line);cursor:pointer;font-size:14px}
.sw input[type=checkbox]{width:20px;height:20px;margin-top:2px;flex:none;accent-color:#14A38B}.sw small{display:block;color:var(--mut);font-size:12px;font-weight:400}
.sw.lock{opacity:.6;cursor:default}
.empty{color:var(--mut);padding:18px 4px}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
/* =====================  EDIT THESE THREE LINES  =====================
   DB       : your Firebase Realtime Database URL (same one as in index.html)
   API_KEY  : Firebase console > Project settings > General > "Web API Key"
   PRICE_INR: only used to estimate revenue on the dashboard (the live price is set under Settings)       */
const ADMIN={DB:'https://friend-museum-default-rtdb.firebaseio.com',API_KEY:'AIzaSyDowauPOBzS6sZu6HLq7b2Ii8zO-KuC8e0',PRICE_INR:99};
/* =================================================================== */

const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const app=$('#app');
const SITE_INDEX=location.href.split('#')[0].replace(/admin\.html.*$/,'')+'index.html';
let LAST_TOKEN='',auth=null,gifts={},replies={},settings={},tab='gifts',filt={q:'',type:'',status:''},note='';

/* ---------- Firebase REST (with the admin's sign-in token) ---------- */
// Firebase REST needs ".json" after the path, e.g. https://db/gifts.json?shallow=true
const dbUrl=path=>{const i=path.indexOf('?'),pp=i<0?path:path.slice(0,i),qs=i<0?'':path.slice(i+1);
  return ADMIN.DB.replace(/\/+$/,'')+'/'+pp+'.json?'+(qs?qs+'&':'')+'auth='+encodeURIComponent(auth.idToken)};
async function refresh(){
  let r;
  try{r=await fetch('https://securetoken.googleapis.com/v1/token?key='+ADMIN.API_KEY,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'grant_type=refresh_token&refresh_token='+encodeURIComponent(auth.refreshToken)})}
  catch(e){throw new Error('Could not reach Google (securetoken.googleapis.com) to renew your session: '+e.message)}
  if(!r.ok)throw new Error('Session expired. Please sign in again.');
  const j=await r.json();auth.idToken=j.id_token;auth.refreshToken=j.refresh_token;auth.at=Date.now();save();
}
async function fb(method,path,body,retry=true){
  let r;
  try{r=await fetch(dbUrl(path),{method,body:body===undefined?undefined:JSON.stringify(body)})}
  catch(e){throw new Error('Could not reach the database for "'+path.split('?')[0]+'" ('+e.message+'). Check that ADMIN.DB is exactly your database URL, and try a private window with extensions off.')}
  // A token only needs renewing once it is old. A fresh token that is refused means the Rules do not allow this user.
  if(r.status==401&&retry&&Date.now()-(auth.at||0)>45*60*1000){await refresh();return fb(method,path,body,false)}
  if(r.status==401||r.status==403)throw new Error('Signed in as '+auth.email+' (UID '+auth.uid+'), but the database refused it. This UID must be the one written in your published Firebase Rules (replace every admin UID there, then Publish).');
  if(!r.ok)throw new Error('Database error '+r.status);
  return r.json();
}
const isFree=g=>g.pay=='FREE'||g.pay=='ADMIN';
const payCell=g=>g.pay=='ADMIN'?'<span class="pill ok">👑 admin</span>':g.pay=='FREE'?'<span class="pill t">🎁 free</span>':g.pay?`<a target="_blank" rel="noopener" href="https://dashboard.razorpay.com/app/payments/${encodeURIComponent(g.pay)}">${esc(g.pay)}</a>`:'<span class="pill bad">none</span>';
// The gift builder (index.html, same website) reads this short-lived token and checks it with the database: only the admin account passes.
const pubTok=()=>{try{localStorage.setItem('om_admin_tok',JSON.stringify({t:auth.idToken,at:auth.at||Date.now()}))}catch(e){}};
const clrTok=()=>{try{localStorage.removeItem('om_admin_tok')}catch(e){}};
// the referrals page (a separate page) reuses this sign-in for up to an hour
async function openReferrals(){
  try{
    if(Date.now()-(auth.at||0)>40*60*1000)await refresh();
    pubTok();
    const w=window.open(SITE_INDEX.replace(/index\.html$/,'')+'admin-referrals.html','_blank');
    say(w?'Opened the referrals & payouts page in a new tab.':'Your browser blocked the pop-up. Allow pop-ups for this site, then press the button again.',!w);
  }catch(e){say(e.message,true)}
}
async function createGift(){
  try{
    if(Date.now()-(auth.at||0)>40*60*1000)await refresh();
    pubTok();
    const w=window.open(SITE_INDEX,'_blank');
    say(w?'Opened the gift builder in a new tab. Payment is skipped for you while you are signed in here.':'Your browser blocked the pop-up. Allow pop-ups for this site, then press the button again.',!w);
  }catch(e){say(e.message,true)}
}
const save=()=>{try{sessionStorage.setItem('om_admin',JSON.stringify(auth))}catch(e){}};

/* ---------- sign in ---------- */
function loginView(msg=''){
  app.innerHTML=`<div class="card login"><h1>🔐 Admin</h1><p class="who">Sign in to manage gifts, replies and settings.</p>
  ${!ADMIN.DB||!ADMIN.API_KEY?'<div class="msg bad">Set <b>DB</b> and <b>API_KEY</b> at the top of admin.html first.</div>':''}
  <label>Email</label><input type="email" id="em" autocomplete="username"><label>Password</label><input type="password" id="pw" autocomplete="current-password">
  <button class="btn" id="go" style="width:100%;margin-top:16px">Sign in</button><div class="err" id="er">${esc(msg)}</div>
  <button class="btn g s" id="dg" style="margin-top:12px">🩺 Run connection check</button>${LAST_TOKEN?'<button class="btn g s" id="dd" style="margin:12px 0 0 6px">🔬 Deep check (uses your sign-in)</button>':''}<div id="dgo" style="font-size:13px;margin-top:8px;line-height:1.6"></div></div>`;
  const go=async()=>{
    $('#er').textContent='';$('#go').disabled=true;
    try{
      const r=await fetch('https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key='+ADMIN.API_KEY,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:$('#em').value.trim(),password:$('#pw').value,returnSecureToken:true})});
      const j=await r.json();if(!r.ok)throw new Error(({EMAIL_NOT_FOUND:'No such admin account.',INVALID_PASSWORD:'Wrong password.',INVALID_LOGIN_CREDENTIALS:'Wrong email or password.',TOO_MANY_ATTEMPTS_TRY_LATER:'Too many attempts. Try later.'})[j.error&&j.error.message]||'Sign-in failed ('+((j.error&&j.error.message)||r.status)+')');
      auth={idToken:j.idToken,refreshToken:j.refreshToken,email:j.email,uid:j.localId,at:Date.now()};save();await load();
    }catch(e){$('#er').textContent=/failed to fetch|networkerror|load failed/i.test(e.message)?'Could not reach Google. Tap “Run connection check” below to see what is blocked.':e.message;$('#go').disabled=false}
  };
  $('#go').onclick=go;$('#pw').onkeydown=e=>{if(e.key=='Enter')go()};
  $('#dg').onclick=diagnose;if($('#dd'))$('#dd').onclick=deepCheck;
}

/* ---------- connection check (shows which connection is blocked) ---------- */
async function diagnose(){
  const out=$('#dgo');out.innerHTML='Checking…';
  const tests=[
    ['Settings in this file',async()=>{if(!ADMIN.DB||!ADMIN.API_KEY)throw new Error('DB or API_KEY is empty in admin.html (is the OLD file still uploaded?)');return 'DB and API key are filled in'}],
    ['Google sign-in service',async()=>{const r=await fetch('https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key='+ADMIN.API_KEY,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:'check@example.com',password:'x',returnSecureToken:true})});const j=await r.json();const m=(j.error&&j.error.message)||'';if(/API key|API_KEY/i.test(m))throw new Error('Google rejected the API key: '+m);if(m=='OPERATION_NOT_ALLOWED')throw new Error('Email/Password sign-in is not enabled in Firebase Authentication');return 'reachable ('+(m||'ok')+')'}],
    ['Google session service',async()=>{const r=await fetch('https://securetoken.googleapis.com/v1/token?key='+ADMIN.API_KEY,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'grant_type=refresh_token&refresh_token=check'});await r.json();return 'reachable'}],
    ['Your database',async()=>{const r=await fetch(ADMIN.DB.replace(/\/+$/,'')+'/settings.json');if(!r.ok)throw new Error('database answered '+r.status);return 'reachable'}]
  ];
  let h='';
  for(const [name,fn] of tests){
    try{h+='✅ '+esc(name)+': '+esc(await fn())+'<br>'}
    catch(e){const net=/failed to fetch|networkerror|load failed/i.test(e.message);h+='❌ '+esc(name)+': '+esc(net?'blocked or no connection. Try: another browser or a private window with extensions off, mobile data instead of Wi-Fi, and turn off VPN / ad blocker / Brave Shields for this site.':e.message)+'<br>'}
    out.innerHTML=h+'Checking…';
  }
  out.innerHTML=h;
}

/* ---------- deep check: which kind of database request is blocked? ---------- */
async function deepCheck(){
  const out=$('#dgo'),base=ADMIN.DB.replace(/\/+$/,'')+'/settings.json',T=LAST_TOKEN;
  const tries=[
    ['Plain request (no token)',()=>fetch(base)],
    ['Header, dummy short token',()=>fetch(base,{headers:{Authorization:'Bearer abc'}})],
    ['Address, dummy short token',()=>fetch(base+'?auth=abc')],
    ['Header, your real token ('+T.length+' chars)',()=>fetch(base,{headers:{Authorization:'Bearer '+T}})],
    ['Address, your real token',()=>fetch(base+'?auth='+encodeURIComponent(T))],
    ['Address, first 300 chars of your token',()=>fetch(base+'?auth='+encodeURIComponent(T.slice(0,300)))]
  ];
  let h='';out.innerHTML='Testing…';
  for(const [name,fn] of tries){
    try{const r=await fn();h+=(r.status<500?'✅ ':'⚠️ ')+esc(name)+': answered (HTTP '+r.status+')<br>'}
    catch(e){h+='❌ '+esc(name)+': blocked ('+esc(e.message)+')<br>'}
    out.innerHTML=h+'Testing…';
  }
  out.innerHTML=h+'<br><b>Copy these lines and send them to your developer.</b>';
}

/* ---------- load everything ---------- */
async function load(){
  app.innerHTML='<div class="card login"><h1>Loading… ⏳</h1></div>';
  try{
    const [ix,rp,st]=await Promise.all([fb('GET','index'),fb('GET','replies'),fb('GET','settings')]);
    gifts=ix||{};replies=rp||{};settings=st||{};
    render();
  }catch(e){LAST_TOKEN=(auth&&auth.idToken)||'';auth=null;clrTok();try{sessionStorage.removeItem('om_admin')}catch(_){}loginView(e.message)}
}

/* ---------- helpers ---------- */
const fmt=t=>t?new Date(t).toLocaleString([], {dateStyle:'medium',timeStyle:'short'}):'—';
const repsOf=g=>replies[g.id]?Object.values(replies[g.id]):[];
const allReplies=()=>{const byId={};Object.entries(gifts).forEach(([code,g])=>{byId[g.id]={code,...g}});const out=[];
  Object.entries(replies).forEach(([gid,o])=>Object.entries(o||{}).forEach(([rid,r])=>out.push({gid,rid,gift:byId[gid],...r})));return out.sort((a,b)=>String(b.ts).localeCompare(String(a.ts)))};
const giftLink=code=>SITE_INDEX+'#c='+code;
const rows=()=>Object.entries(gifts).map(([code,g])=>({code,...g})).sort((a,b)=>String(b.created||'').localeCompare(String(a.created||'')));
function csv(name,head,list){const q=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';const t=head.join(',')+'\n'+list.map(r=>r.map(q).join(',')).join('\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/csv'}));a.download=name;a.click()}
const say=(m,bad)=>{note=m?`<div class="msg ${bad?'bad':''}">${esc(m)}</div>`:'';const n=$('#note');if(n)n.innerHTML=note};

/* ---------- main view ---------- */
function render(){
  const list=rows(),paid=list.filter(g=>g.pay&&!isFree(g)),free=list.filter(isFree),unpaid=list.filter(g=>!g.pay),off=list.filter(g=>g.disabled),rp=allReplies();
  const price=+settings.price>0?+settings.price:ADMIN.PRICE_INR;
  app.innerHTML=`<div class="top"><h1>🎛️ Admin dashboard</h1><span class="sp"></span><span class="who">${esc(auth.email)}</span><button class="btn" id="cg" title="Opens the gift builder with payment skipped for you">➕ Create gift (no payment)</button><button class="btn g" id="mr" title="Referral rewards, UPI withdrawals, history and reports">💰 Referrals &amp; payouts</button><button class="btn g" id="rf">↻ Refresh</button><button class="btn g" id="lo">Sign out</button></div>
  <div class="stats">
   <div class="stat"><b>${list.length}</b><span>Gifts created</span></div>
   <div class="stat"><b>${list.filter(g=>g.type=='bday').length} / ${list.filter(g=>g.type!='bday').length}</b><span>Birthday / Friendship</span></div>
   <div class="stat good"><b>${paid.length}</b><span>With a payment ID</span></div>
   <div class="stat"><b>${free.length}</b><span>Free / admin-made</span></div>
   <div class="stat ${unpaid.length?'warn':''}"><b>${unpaid.length}</b><span>No payment ID ⚠️</span></div>
   <div class="stat good"><b>₹${(paid.length*price).toLocaleString('en-IN')}</b><span>Est. revenue (at ₹${price})</span></div>
   <div class="stat"><b>${rp.length}</b><span>Replies</span></div>
   <div class="stat"><b>${off.length}</b><span>Disabled links</span></div>
   <div class="stat ${settings.paused?'warn':''}"><b>${settings.paused?'Paused':'Live'}</b><span>New gifts</span></div>
  </div>
  <div id="note">${note}</div>
  <div class="tabs"><button data-t="gifts" class="${tab=='gifts'?'on':''}">🎁 Gifts (${list.length})</button><button data-t="replies" class="${tab=='replies'?'on':''}">💌 Replies (${rp.length})</button><button data-t="steps" class="${tab=='steps'?'on':''}">🧩 Builder steps</button><button data-t="settings" class="${tab=='settings'?'on':''}">⚙️ Settings</button></div>
  <div class="card" id="pane"></div>`;
  $('#rf').onclick=load;$('#cg').onclick=createGift;$('#mr').onclick=openReferrals;$('#lo').onclick=()=>{auth=null;clrTok();try{sessionStorage.removeItem('om_admin')}catch(e){}loginView()};
  app.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;note='';render()});
  ({gifts:paneGifts,replies:paneReplies,steps:paneSteps,settings:paneSettings})[tab]();
}

/* ---------- gifts ---------- */
function paneGifts(){
  const pane=$('#pane');
  pane.innerHTML=`<div class="bar"><input id="q" type="text" placeholder="Search name, sender, code, payment ID…" value="${esc(filt.q)}">
   <select id="ft"><option value="">All types</option><option value="bday" ${filt.type=='bday'?'selected':''}>🎂 Birthday</option><option value="friend" ${filt.type=='friend'?'selected':''}>🤝 Friendship</option></select>
   <select id="fs"><option value="">All status</option><option value="paid" ${filt.status=='paid'?'selected':''}>Paid</option><option value="free" ${filt.status=='free'?'selected':''}>Free / admin-made</option><option value="unpaid" ${filt.status=='unpaid'?'selected':''}>No payment ID</option><option value="off" ${filt.status=='off'?'selected':''}>Disabled</option></select>
   <button class="btn g" id="ex">⬇ CSV</button><button class="btn g" id="im" title="Add gifts made before the dashboard existed">⤓ Import old gifts</button></div>
  <div class="tw"><table><thead><tr><th>Created</th><th>Type</th><th>For</th><th>From</th><th>Payment</th><th>Replies</th><th>Status</th><th>Actions</th></tr></thead><tbody id="tb"></tbody></table></div><div id="emp"></div>`;
  const draw=()=>{
    const q=filt.q.toLowerCase();
    const list=rows().filter(g=>(!q||[g.name,g.from,g.code,g.pay,g.id].join(' ').toLowerCase().includes(q))&&(!filt.type||(g.type||'friend')==filt.type)&&
      (!filt.status||(filt.status=='paid'&&g.pay&&!isFree(g))||(filt.status=='free'&&isFree(g))||(filt.status=='unpaid'&&!g.pay)||(filt.status=='off'&&g.disabled)));
    $('#tb').innerHTML=list.slice(0,500).map(g=>`<tr>
      <td>${fmt(g.created)}</td><td><span class="pill t">${g.type=='bday'?'🎂 Birthday':'🤝 Friend'}</span></td><td>${esc(g.name)}</td><td>${esc(g.from)}</td>
      <td>${payCell(g)}</td>
      <td>${repsOf(g).length}</td><td>${g.disabled?'<span class="pill off">disabled</span>':'<span class="pill ok">live</span>'}</td>
      <td><div class="acts"><button class="btn s g" data-a="view" data-c="${esc(g.code)}">View</button><a class="btn s g" target="_blank" rel="noopener" href="${esc(giftLink(g.code))}" style="text-decoration:none">Open ↗</a>
        <button class="btn s g" data-a="copy" data-c="${esc(g.code)}">Copy link</button>
        <button class="btn s ${g.disabled?'':'r'}" data-a="${g.disabled?'on':'off'}" data-c="${esc(g.code)}">${g.disabled?'Enable':'Disable'}</button>
        <button class="btn s r" data-a="del" data-c="${esc(g.code)}">Delete</button></div></td></tr>`).join('');
    $('#emp').innerHTML=list.length?'':'<div class="empty">No gifts match. New gifts appear here automatically. Gifts made before this dashboard can be added with “Import old gifts”.</div>';
  };
  draw();
  $('#q').oninput=e=>{filt.q=e.target.value;draw()};$('#ft').onchange=e=>{filt.type=e.target.value;draw()};$('#fs').onchange=e=>{filt.status=e.target.value;draw()};
  $('#ex').onclick=()=>csv('gifts.csv',['code','type','for','from','payment_id','created','disabled','replies'],rows().map(g=>[g.code,g.type||'friend',g.name,g.from,g.pay||'',g.created||'',g.disabled?'yes':'',repsOf(g).length]));
  $('#im').onclick=importOld;
  $('#tb').onclick=async e=>{const b=e.target.closest('button[data-a]');if(!b)return;const code=b.dataset.c,a=b.dataset.a;
    try{
      if(a=='copy'){await navigator.clipboard.writeText(giftLink(code));b.textContent='Copied ✓';return}
      if(a=='view')return viewGift(code);
      if(a=='off'||a=='on'){const v=a=='off';await fb('PATCH','gifts/'+code,{disabled:v});await fb('PATCH','index/'+code,{disabled:v});gifts[code].disabled=v;say((v?'Disabled ':'Enabled ')+code);return render()}
      if(a=='del'){const g=gifts[code];if(!confirm(`Delete the gift for "${g.name}" (${code}) permanently?\nIts link will stop working. This cannot be undone.`))return;
        await fb('DELETE','gifts/'+code);await fb('DELETE','index/'+code);delete gifts[code];say('Deleted '+code);return render()}
    }catch(err){say(err.message,true);const n=$('#note');n&&n.scrollIntoView()}
  };
}
async function importOld(){
  if(!confirm('Scan all saved gifts and add the ones missing from this list? This may take a moment.'))return;
  try{
    const keys=Object.keys(await fb('GET','gifts?shallow=true')||{}).filter(k=>!gifts[k]);let n=0;
    for(const k of keys){const g=await fb('GET','gifts/'+k);if(!g||!g.name)continue;
      const e={id:g.id||'',type:g.type||'friend',name:g.name,from:g.from,created:g.created||'',pay:g.payId||''};if(g.disabled)e.disabled=true;
      await fb('PUT','index/'+k,e);gifts[k]=e;n++;say(`Imported ${n} of ${keys.length}…`)}
    say(n?`Imported ${n} old gift${n==1?'':'s'}.`:'Nothing to import: the list is already complete.');render();
  }catch(e){say(e.message,true)}
}
async function viewGift(code){
  const m=document.createElement('div');m.className='modal';m.innerHTML='<div class="card">Loading…</div>';document.body.appendChild(m);
  m.onclick=e=>{if(e.target==m)m.remove()};
  try{
    const g=await fb('GET','gifts/'+code);if(!g){m.firstChild.innerHTML='Gift not found. <button class="btn g" id="x">Close</button>';$('#x',m).onclick=()=>m.remove();return}
    const bal=(g.balloons||[]).filter(x=>x&&x.trim()),notes=g.notes||[],rules=g.rules||[];
    m.firstChild.innerHTML=`<h2>${g.type=='bday'?'🎂':'🤝'} ${esc(g.name)} <small style="font-weight:500;color:var(--mut)">from ${esc(g.from)}</small></h2>
    <div class="kv"><b>Code</b><span>${esc(code)}</span><b>Gift ID</b><span>${esc(g.id||'—')}</span><b>Created</b><span>${fmt(g.created)}</span>
    <b>Payment</b><span>${g.payId?esc(g.payId):'<span class="pill bad">none</span>'}</span>${g.ref?`<b>Referred by</b><span>${esc(g.ref)}</span>`:''}<b>Status</b><span>${g.disabled?'disabled':'live'}</span>
    ${g.type=='bday'?`<b>Cake</b><span>${esc(g.cake)}</span><b>Mini game</b><span>${g.game===true?'yes':'no'}</span><b>Song</b><span>${esc(g.song||'bday')}</span><b>Age / birthday</b><span>${esc(g.age||'—')} · ${g.bm&&g.bd?esc(g.bd+'/'+g.bm):'—'}</span><b>Balloons</b><span>${bal.map(esc).join('<br>')||'—'}</span>`
      :`<b>Kind / vibe</b><span>${esc(g.kind)} · ${esc(g.vibe)}</span><b>Notes</b><span>${notes.map(esc).join('<br>')||'—'}</span><b>Rules</b><span>${rules.map(esc).join('<br>')||'—'}</span>`}
    <b>Message</b><span style="white-space:pre-wrap">${esc(g.msg||'—')}</span></div>
    <b style="color:var(--mut);font-size:13px">Photos (${(g.photos||[]).length})</b><div class="thumbs">${(g.photos||[]).map(p=>`<div><img src="${esc(p.src)}"><div style="font-size:11px;max-width:92px">${esc(p.cap)}</div></div>`).join('')||'—'}</div>
    <div class="row" style="margin-top:16px"><button class="btn g" id="x">Close</button></div>`;
    $('#x',m).onclick=()=>m.remove();
  }catch(e){m.firstChild.innerHTML=esc(e.message)+' <button class="btn g" id="x">Close</button>';$('#x',m).onclick=()=>m.remove()}
}

/* ---------- replies ---------- */
function paneReplies(){
  const list=allReplies(),pane=$('#pane');
  pane.innerHTML=`<div class="bar"><button class="btn g" id="ex">⬇ CSV</button></div><div class="tw"><table><thead><tr><th>When</th><th>Gift for</th><th>Reply from</th><th>Reply</th><th>Time</th><th>Moves</th><th>Quiz</th><th></th></tr></thead>
  <tbody>${list.map(r=>`<tr><td>${fmt(r.ts)}</td><td>${r.gift?esc(r.gift.name)+' <small style="color:var(--mut)">('+esc(r.gift.code)+')</small>':'<small>deleted gift</small>'}</td><td>${esc(r.name)}</td>
  <td style="max-width:340px;white-space:pre-wrap">${r.reply?esc(r.reply):'<span class="who">(opened, no reply)</span>'}</td><td>${r.elapsed||0}s</td><td>${r.moves||0}</td><td>${esc(r.quiz||'—')}</td>
  <td><button class="btn s r" data-g="${esc(r.gid)}" data-r="${esc(r.rid)}">Delete</button></td></tr>`).join('')}</tbody></table></div>${list.length?'':'<div class="empty">No replies yet.</div>'}`;
  $('#ex').onclick=()=>csv('replies.csv',['when','gift_for','reply_from','reply','seconds','moves','quiz'],list.map(r=>[r.ts,r.gift?r.gift.name:'',r.name,r.reply||'',r.elapsed||0,r.moves||0,r.quiz||'']));
  pane.onclick=async e=>{const b=e.target.closest('button[data-r]');if(!b||!confirm('Delete this reply?'))return;
    try{await fb('DELETE','replies/'+b.dataset.g+'/'+b.dataset.r);delete replies[b.dataset.g][b.dataset.r];say('Reply deleted');render()}catch(err){say(err.message,true)}};
}

/* ---------- builder steps ---------- */
const STD={friend:true,bday:true,f_kind:true,f_vibe:true,f_photos:true,f_maxPhotos:4,f_puzzle:true,f_msg:true,f_rules:true,f_quiz:true,f_story:true,f_awards:true,b_balloons:true,b_photos:true,b_maxPhotos:5,b_letter:true,b_game:'choose',songs:{bday:true,box:true,pop:true,dance:true,none:true},fsongs:{calm:true,pop:true,lofi:true,box:true,none:true}};
const FSONGNAMES=[['calm','🌿 Calm & dreamy'],['pop','🎉 Upbeat friends'],['lofi','☕ Lo-fi chill'],['box','🎶 Music box'],['none','🔇 No music']];
const SONGNAMES=[['bday','🎂 Happy Birthday'],['box','🎶 Music Box'],['pop','🎉 Party Pop'],['dance','🪩 Dance Beat'],['none','🔇 No music']];
const stepsNow=()=>{const o=JSON.parse(JSON.stringify(STD));const c=settings.steps||{};Object.keys(c).forEach(k=>{if(k!='songs')o[k]=c[k]});o.songs=Object.assign({},STD.songs,c.songs||{});o.fsongs=Object.assign({},STD.fsongs,c.fsongs||{});return o};
function paneSteps(){
  const c=stepsNow(),pane=$('#pane');
  const sw=(id,label,sub,locked)=>{const on=id.startsWith('song_')?c.songs[id.slice(5)]!==false:id.startsWith('fsong_')?c.fsongs[id.slice(6)]!==false:c[id]!==false;return `<label class="sw ${locked?'lock':''}"><input type="checkbox" id="st_${id}" ${locked||on?'checked':''} ${locked?'disabled':''}><span><b>${label}</b><small>${sub}</small></span></label>`};
  const sel=(id,label,opts)=>`<label class="sw"><span style="flex:1"><b>${label}</b></span><select id="st_${id}" style="width:auto">${opts.map(o=>`<option value="${o[0]}" ${String(c[id])==String(o[0])?'selected':''}>${o[1]}</option>`).join('')}</select></label>`;
  pane.innerHTML=`<p class="who" style="margin-bottom:10px">Choose what people can do in the gift builder. Turning a step off removes it from the builder; gifts already made are not changed, and the gift page simply skips anything it does not contain. Changes apply within seconds.</p>
  <div class="grid3">
   <div class="grp"><h3>🎛️ Occasions</h3>${sw('friend','🤝 Friendship museum','People can make this gift')}${sw('bday','🎂 Birthday surprise','People can make this gift')}</div>
   <div class="grp"><h3>🎂 Birthday builder</h3>
     ${sw('name','Names, age & birthday','Always asked',true)}${sw('cake','Cake choice','Always asked',true)}
     ${sel('b_game','🎮 Mini game',[['choose','Creator chooses'],['on','Always included'],['off','Never included']])}
     <div class="who" style="margin:10px 0 0;font-weight:700">🎵 Songs the creator can choose from</div>
     ${SONGNAMES.map(x=>sw('song_'+x[0],x[1],'Shown in the builder')).join('')}
     ${sw('b_balloons','🎈 Balloons step','Reasons they are loved')}
     ${sw('b_photos','📸 Photos step','Photos, scratch cards & game cards')}${sel('b_maxPhotos','Max photos',[1,2,3,4,5].map(n=>[n,n]))}
     ${sw('b_letter','💌 Letter step','The birthday letter')}${sw('review','Preview & link','Always shown',true)}</div>
   <div class="grp"><h3>🤝 Friendship builder</h3>
     ${sw('name2','Names','Always asked',true)}
     ${sw('f_kind','Kind of friend & start date','Counts the days of friendship')}
     ${sw('f_vibe','Vibe & reasons','Colours and the notes room')}
     ${sw('f_photos','📸 Photos step','Gallery room')}${sel('f_maxPhotos','Max photos',[1,2,3,4].map(n=>[n,n]))}
     ${sw('f_puzzle','🧩 Photo puzzle','The puzzle room')}
     ${sw('f_quiz','🧠 Friendship quiz','Bonus room: “How well do you know me?”')}
     ${sw('f_story','📖 Our story timeline','Bonus room: moments revealed one by one')}
     ${sw('f_awards','🏆 Friendship awards','Bonus room: awards night')}
     <div class="who" style="margin:10px 0 0;font-weight:700">🎵 Background music the creator can choose from</div>
     ${FSONGNAMES.map(x=>sw('fsong_'+x[0],x[1],'Shown in the builder')).join('')}
     ${sw('f_msg','💌 Message step','The sealed letter')}
     ${sw('f_rules','📜 Rules step','Tick & sign rooms')}${sw('review2','Preview & link','Always shown',true)}</div>
  </div>
  <div class="row" style="margin-top:14px"><button class="btn" id="sv">Save changes</button><button class="btn g" id="rs">Reset to defaults</button></div>`;
  $('#sv').onclick=async()=>{
    const v=id=>$('#st_'+id),o={songs:{}};
    ['friend','bday','f_kind','f_vibe','f_photos','f_puzzle','f_quiz','f_story','f_awards','f_msg','f_rules','b_balloons','b_photos','b_letter'].forEach(k=>o[k]=v(k).checked);
    o.fsongs={};FSONGNAMES.forEach(x=>o.fsongs[x[0]]=v('fsong_'+x[0]).checked);
    SONGNAMES.forEach(x=>o.songs[x[0]]=v('song_'+x[0]).checked);
    o.b_game=v('b_game').value;o.b_maxPhotos=+v('b_maxPhotos').value;o.f_maxPhotos=+v('f_maxPhotos').value;
    if(!o.friend&&!o.bday)return say('Keep at least one occasion turned on.',true);
    if(!Object.values(o.songs).some(Boolean))return say('Keep at least one birthday song turned on (or “No music”).',true);
    if(!Object.values(o.fsongs).some(Boolean))return say('Keep at least one friendship music option turned on (or “No music”).',true);
    try{await fb('PUT','settings/steps',o);settings.steps=o;say('Builder steps saved.');render()}catch(e){say(e.message,true)}
  };
  $('#rs').onclick=async()=>{if(!confirm('Reset every builder step to its default (all on)?'))return;try{await fb('DELETE','settings/steps');delete settings.steps;say('Builder steps reset to defaults.');render()}catch(e){say(e.message,true)}};
}

/* ---------- settings ---------- */
function paneSettings(){
  const pane=$('#pane'),price=+settings.price>0?+settings.price:ADMIN.PRICE_INR;
  pane.innerHTML=`<div class="set"><div><label>Price per gift (₹)</label><div class="row"><input type="number" id="pr" min="1" step="1" value="${price}" style="max-width:140px"><button class="btn" id="sp">Save price</button></div>
  <p class="who" style="margin-top:6px">Applies to everyone within seconds. The Razorpay popup and the page both use it.</p></div>
  <div><label>New gifts</label><div class="row"><button class="btn ${settings.paused?'':'r'}" id="pz">${settings.paused?'▶ Resume new gifts':'⏸ Pause new gifts'}</button></div>
  <p class="who" style="margin-top:6px">While paused, nobody can pay or create a link. Existing gift links keep working.</p></div>
  <div><label>Free mode (no payment for anyone)</label><div class="row"><button class="btn ${settings.free?'r':''}" id="fm">${settings.free?'⏹ Turn free mode OFF (payment required again)':'🎁 Turn free mode ON (anyone can create a link free)'}</button></div>
  <p class="who" style="margin-top:6px">${settings.free?'<b>Free mode is ON.</b> Everyone skips payment, and their gifts are marked “free”.':'While ON, nobody is asked to pay. Gifts are marked “free” in the list so you can tell them apart.'}</p></div>
  <div><label>Admin creating gifts</label><p class="who">Use <b>➕ Create gift (no payment)</b> at the top. While you are signed in here, the builder skips payment for you only, and marks the gift “admin”.</p></div>
  <div><label>Danger zone</label><p class="who">Use Disable / Delete on a gift in the Gifts tab. Deleted gifts cannot be recovered.</p></div></div>`;
  $('#sp').onclick=async()=>{const v=Math.round(+$('#pr').value);if(!(v>0))return say('Enter a valid price.',true);
    try{await fb('PATCH','settings',{price:v});settings.price=v;say('Price saved: ₹'+v);render()}catch(e){say(e.message,true)}};
  $('#fm').onclick=async()=>{const v=!settings.free;if(v&&!confirm('Turn free mode ON? Everyone will be able to create gift links without paying.'))return;try{await fb('PATCH','settings',{free:v});settings.free=v;say(v?'Free mode is ON: no payment is required.':'Free mode is OFF: payment is required again.');render()}catch(e){say(e.message,true)}};
  $('#pz').onclick=async()=>{const v=!settings.paused;try{await fb('PATCH','settings',{paused:v});settings.paused=v;say(v?'New gifts are paused.':'New gifts are live again.');render()}catch(e){say(e.message,true)}};
}

/* ---------- start ---------- */
(async()=>{
  try{const s=JSON.parse(sessionStorage.getItem('om_admin')||'null');if(s&&s.idToken){auth=s;return load()}}catch(e){}
  loginView();
})();
</script>
